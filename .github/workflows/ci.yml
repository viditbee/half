name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run the suite
        run: uv run --locked --python ${{ matrix.python }} --extra dev pytest -q

  invariants:
    # AD-4 and AD-30 say these are enforced per commit rather than by
    # convention. They run in the suite above too — this job exists so a red
    # build names which invariant broke instead of saying "tests failed".
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 'AD-4: replay reproduces byte-identical state'
        run: uv run --locked --extra dev pytest tests/test_replay.py -q

      - name: 'AD-30: the fold is pure'
        run: uv run --locked --extra dev pytest tests/test_purity.py -q

      - name: 'AD-2: the runtime imports only stdlib and pinned dependencies'
        # Lives in the suite (tests/test_dependencies.py) rather than inline
        # here, so the gate itself is testable. The inline version checked
        # declaration rather than pinning and hardcoded one import-name
        # mapping, so it passed an unpinned dependency and failed a correctly
        # pinned one.
        run: uv run --locked --extra dev pytest tests/test_dependencies.py -q

      - name: 'AD-11: no secret material in the tree'
        # In the suite (tests/test_secret_gate.py) so the gate itself is
        # testable, matching the AD-2 step above. An inline version drifted
        # away from scan_for_secrets and stopped checking untracked files.
        run: uv run --locked --extra dev pytest tests/test_secret_gate.py -q

      - name: 'AD-24: retrieval weights and never excludes'
        # A topic switch that can empty the candidate set, or a cap that drops
        # beliefs without saying so, is what produces "I don't have access to
        # that" — the sentence the spec rejects outright.
        run: uv run --locked --extra dev pytest -q -m ad24

      - name: 'AD-18: licenses are enforced at context construction'
        # The real assertion, replacing story 4's interim ban rather than
        # deleting it: a `behave` or `ask` belief's claim text appears nowhere
        # in a constructed context or in a reply, asserted byte-wise over the
        # whole rendering — while `assert` text may now reach the main.
        # Marker-selected rather than file-selected, so this cannot go green
        # only because another step already ran one of the same files.
        #
        # The count is asserted because a marker gate has a silent failure
        # mode a passing run looks identical to: `pytest -m ad99` deselects
        # everything and exits 0, so a renamed or misspelled marker turns this
        # step green having asserted nothing. --strict-markers (pyproject)
        # catches the misspelling; the floor catches the rename, and catches
        # someone quietly unmarking the cases this gate exists for.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad18 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-18 cases collected: $collected"
          if [ "$collected" -lt 40 ]; then
            echo "::error::the AD-18 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad18

      - name: 'AD-28: one license ceiling, applied where licenses are resolved'
        # The ceiling is a single point of enforcement, which is exactly the
        # kind of invariant that decays quietly: nothing breaks when a new
        # surface resolves a license without it, the suite stays green, and
        # aftercare silently stops capping that surface. So this gate names it.
        #
        # Marker-selected rather than file-selected, for the same reason the
        # AD-18 step is: it must not go green because another step happened to
        # run one of the same files.
        #
        # The count is asserted for the reason the AD-18 step gives — a marker
        # gate that selects nothing exits 0 and looks identical to a passing
        # one. --strict-markers (pyproject) catches a misspelling; this floor
        # catches a rename, and catches someone quietly unmarking the cases
        # the gate exists for.
        #
        # The marker is applied case by case rather than file-wide, and the
        # floor sits just under the count for a reason the first version got
        # wrong: `pytestmark` marked the whole of test_ladder.py, so the count
        # included every rung, quarantine and promotion case — CAP-10, not
        # AD-28 — and every ceiling test could have been deleted with the step
        # still passing comfortably. 51 selected, 45 required: prune a
        # redundant case, do not gut the gate.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad28 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-28 cases collected: $collected"
          if [ "$collected" -lt 45 ]; then
            echo "::error::the AD-28 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad28

      - name: 'CAP-12: the crisis mode — the switch, the moment, the never-list'
        # The one path where a mistake is unrecoverable, so it gets a gate of
        # its own rather than living inside "tests failed". It covers the tier
        # table, the two actions and their two costs, the templated reply, the
        # never-list, the golden pins over the reviewed corpus, and the
        # C-SSRS-shaped escalating red-team suite.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18
        # and AD-28 steps give: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap12` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename, and catches someone quietly unmarking the
        # cases the gate exists for.
        #
        # **This gate is not clinical review.** The companion's build
        # requirement 6 is a qualified reviewer before launch, and a green run
        # here does not satisfy it or substitute for it.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 cases collected: $collected"
          if [ "$collected" -lt 950 ]; then
            echo "::error::the CAP-12 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12

      - name: 'CAP-12: crisis state survives eviction, restart and a full disk'
        # A second gate over a subset, because the first floor had a silent
        # failure mode that review found by arithmetic: it was set to exactly
        # the count remaining after deleting every durability case, so the
        # whole durable half of the story could be removed — the mode, the
        # ceiling and the retrieval disable all reverting to memory — with the
        # CAP-12 step still green and still above its floor.
        #
        # These are the cases driven through the real runtime and the real
        # store: the mode across a restart and an eviction, the ceiling in the
        # log, the retrieval switch rehydrated off, the entry record, the
        # operator reversal, and a reply still sent when the disk is full. A
        # subset with its own floor cannot be hollowed out by a floor set on
        # the superset.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_durable -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 durability cases collected: $collected"
          if [ "$collected" -lt 80 ]; then
            echo "::error::the durability gate collected $collected cases; the mode may no longer be durable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_durable

      - name: 'CAP-12: the warm handoff — confirmed, offered, drafted, never sent'
        # A third gate over a third subset, for the reason the durability gate
        # exists: a floor on the superset cannot stop the handoff being
        # hollowed out. The CAP-12 count is large enough that every one of
        # these cases could be deleted and that step would still pass
        # comfortably — and the half of the story that would go with them is
        # the half where a mistake reaches a third party.
        #
        # These are the cases for the confirmed list (an inferred candidate is
        # never offered, and neither is a quarantined one — offerability is the
        # ladder's whole answer), the two-or-three rule, the clinician door,
        # the region told and never inferred, the versioned directory and every
        # way it can degrade, the templated draft, the pinned row format, the
        # guard that splits the way the renderer joins, and the structural
        # assertion — globbed over the package, so a module written next year
        # is covered — that no crisis module has a send to a third party to
        # reach at all.
        #
        # **This gate is not clinical review**, and here that covers the data
        # as well as the code: build requirement 6 governs every entry in
        # `data/crisis-lines.json`, and a number that is right in shape and
        # wrong in fact passes every case below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_handoff -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 handoff cases collected: $collected"
          if [ "$collected" -lt 290 ]; then
            echo "::error::the handoff gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_handoff

      - name: 'CAP-12: aftercare — the floor, the steps, the answer, the held plan'
        # A fourth gate over a fourth subset, for the reason the durability and
        # handoff gates exist: a floor on the superset cannot stop this half
        # being hollowed out, and every case below could be deleted with the
        # CAP-12 step still green and still comfortably above its own floor.
        #
        # What it covers: that nothing restores inside the thirty-day floor by
        # any path; that reaching it grants one rung and never the lot; that
        # the second step has its own floor; that the mirror is *asked* for and
        # the cap holds until the main answers; that silence and a hedge are
        # both refused as consent; that a decline holds the cap and is not for
        # ever; that a second crisis restarts the floor from the later entry;
        # that the operator reversal still works and is deliberately not
        # stepwise; that the arithmetic is a pure function of two stamps with
        # no clock anywhere under `half/crisis`; and that a held safety plan
        # comes back word for word while there is exactly one expression in the
        # tree that could write one.
        #
        # **The floor carries a margin that is not the cases it protects.**
        # Review round 1 found the first version set to exactly the count left
        # after deselecting the twelve single-case property tests — the writer
        # gate, the quarantine rule, the unprompted-yes rule, the closed-set
        # plan guard, both quiet rules — so every one of them could be deleted
        # with all four gates green. That is story 6a's floor bug, one story
        # on. The floor is now well under the count *and* the property cases
        # carry their own marker and their own gate below, so deleting them
        # fails twice: their gate collects nothing, and this one drops beneath
        # its floor.
        #
        # **This gate is not clinical review.** Every wording it exercises —
        # the question Half puts before the mirror resumes, and the frame
        # around a document somebody else wrote — is on the reviewer's list,
        # and a green run here does not satisfy build requirement 6 or
        # substitute for it. Nor does it say the schedule itself is right: the
        # floor, the dwells and the two intervals are numbers a qualified
        # reviewer has to agree with, and this only proves the build honours
        # them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 aftercare cases collected: $collected"
          if [ "$collected" -lt 210 ]; then
            echo "::error::the aftercare gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare

      - name: 'CAP-12: the structural rules aftercare and the safety plan rest on'
        # The property cases, gated separately from the behavioural ones they
        # sit beside. Each is a single case asserting something no amount of
        # behaviour can show: that only one expression in the tree can write a
        # safety plan and that every call site hands it a value it was *given*;
        # that no module knows the shape of a plan; that nothing here reads a
        # clock, a tier or a payment state; that a restore names no target;
        # that a question Half never asked cannot be answered.
        #
        # A floor on the suite they belong to cannot protect them — they are a
        # fiftieth of it — which is exactly how the first version of the
        # aftercare gate came to have a floor equal to the count without them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare_property -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 property cases collected: $collected"
          if [ "$collected" -lt 45 ]; then
            echo "::error::the property gate collected $collected cases; the structural rules are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare_property

      - name: 'CAP-6: the open-loop ledger — the vocabulary, the timescale, the silence'
        # The ledger is the ranking function for everything Half does, and
        # every one of its rules is the kind that decays quietly: nothing
        # breaks the day a state is spelled two ways, a timescale acquires a
        # default, a movement date stops being validated, or silence starts
        # being stored instead of computed. The suite stays green and the
        # ranking is silently different. So this names it.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28 and CAP-12 steps are: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap6` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename.
        #
        # **A floor is the weakest of the three protections here, and review
        # proved it.** The first version was 92 collected against 80 required,
        # and deleting exactly the two AST guards the firewall rests on dropped
        # it to 90 — comfortably green, with the property unguarded. So the
        # firewall and the structural guards now carry their own markers and
        # their own gates below, *and* the cases each of those gates exists for
        # are named inside the suite itself
        # (`test_every_structural_guard_this_story_rests_on_still_exists`), so
        # deleting one fails by name rather than by arithmetic. 187 selected,
        # 160 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 cases collected: $collected"
          if [ "$collected" -lt 160 ]; then
            echo "::error::the CAP-6 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6

      - name: 'CAP-6: the refutation firewall — a wanting is never demoted or frozen'
        # A second gate over the subset that matters most, for the reason the
        # CAP-12 durability and handoff gates exist: a floor on the superset
        # cannot stop this half being hollowed out, and the half that would go
        # with it is the half where Half starts treating *"the main has done
        # nothing about the farmland for a year"* as evidence they never wanted
        # it.
        #
        # These are the cases for a retracted, revised and expunged support; a
        # correction that names the loop's own identifier; a tombstone that
        # shares it; a year of no evidence leaving the wanting standing; and —
        # added after review — that a loop left standing can **still move**.
        # That last one is not a refinement: one shared `expunged` set left a
        # loop present in the fold, passing every assertion above, while
        # silently dropping every later transition on it for ever. A wanting
        # that can never advance, be achieved, or change at all has been demoted
        # under another name.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_firewall -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 firewall cases collected: $collected"
          if [ "$collected" -lt 9 ]; then
            echo "::error::the firewall gate collected $collected cases; a loop may now be refutable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_firewall

      - name: 'CAP-6: the firewall as a property of the package, not a spelling'
        # A third gate, over the structural guards, and it exists because the
        # first version of this story had none worth the name. It asserted that
        # two `fold` case bodies did not contain the substring "loops" — a
        # spelling — and three mutations walked past it with all 1836 tests
        # green: a demotion in the `Op.TENSION` branch (Half lowering a wanting
        # because contradicting evidence arrived, the exact CAP-6 violation),
        # the same demotion moved into a module-scope helper, and a new
        # `half/loops/decay.py` exporting `demote`.
        #
        # What these assert instead: that only the transition case and the
        # loop-named expunge block may *name* the loop table inside `fold`;
        # that nothing anywhere under `half/` mutates it outside those two
        # places, by any of the seven ways a dict can be changed; and that only
        # the ledger can compose a record carrying both a loop and a state, in
        # either of the two shapes such a record gets built. Each runs against
        # a synthetic bypass of its own, so none can pass having seen nothing.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 structural cases collected: $collected"
          if [ "$collected" -lt 12 ]; then
            echo "::error::the structural gate collected $collected cases; the firewall is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_structure

      - name: 'AD-9: a due-time queue, never a cron'
        # Nothing else in the product runs on a schedule, so every rule here is
        # one that decays in silence: nothing breaks the day the grace window
        # widens into a catch-up, the concurrency bound stops being applied, the
        # file lock is dropped because "one worker anyway", or jitter becomes a
        # `random` draw that loses the spread on every restart. The suite stays
        # green and a thousand mains quietly share an instant — or wake up to a
        # week of yesterday's thoughts at once.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12 and CAP-6 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review round 1 had to establish for the third story running. 109
        # selected, 95 required — and the twenty-nine guarantee cases are
        # marked separately and gated below, so deleting them lands on 80 and
        # fails *twice*: their own gate collects nothing, and this one drops
        # beneath its floor. The one-clock cases are inside this count too, for
        # the same reason.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 cases collected: $collected"
          if [ "$collected" -lt 95 ]; then
            echo "::error::the AD-9 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9

      - name: 'AD-9: the promises inside the queue'
        # A second gate over the subset that carries the story, for the reason
        # the CAP-12 durability and CAP-6 firewall gates exist. These are the
        # cases a mutation has actually been run against, each failing by name:
        #
        #   catch-up on a missed window, through `tick` *and* through
        #   `run_forever` (a startup `_catch_up()` was green across 2002 tests);
        #   `while True` replaced by one iteration; the loop's `except` replaced
        #   by `raise`; `ScheduleError` swallowed; an unbounded semaphore; the
        #   shipped bound, timeout and grace at absurd values; `flock` removed;
        #   `_is_contention` returning True; `note_pass` bypassing the per-main
        #   mutex; `_advance` swallowing a failed write and running the pass
        #   anyway; jitter added to a resolved 03:00 rather than placed inside
        #   the real window (eighteen zones at 05:57 local on the EET spring
        #   transition); `DERIVED_VERSION` reverted; the fold's fatal branch
        #   deleted; and `ticker.cancel()` inserted after `create_task` in
        #   `serve`.
        #
        # 29 selected, 25 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 guarantee cases collected: $collected"
          if [ "$collected" -lt 25 ]; then
            echo "::error::the AD-9 guarantee gate collected $collected cases; the promises are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9_guarantee

      - name: 'AD-30: one clock reader, and a zone that is told'
        # The structural half of story 9a: the scans, and the non-vacuity cases
        # that feed each scan every shape it must see. A behavioural test cannot
        # cover any of it — a scheduler reading the host zone agrees with every
        # other case in the suite on a machine set to UTC, and a second clock
        # reader breaks nothing until two subsystems disagree about what "today"
        # is, a year later.
        #
        # 40 selected, 30 required, with the eighteen guarantee cases gated
        # separately below: deleting them lands on 22 and fails both steps.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock-reader cases collected: $collected"
          if [ "$collected" -lt 30 ]; then
            echo "::error::the one-clock gate collected $collected cases; a second clock reader is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock

      - name: 'AD-30: the sentences the one-clock rule exists to make true'
        # The guarantee subset, because review round 1 found the first version
        # of the one-clock floor sized so that deleting exactly the three
        # guarantee cases landed on it and passed — leaving eight non-vacuity
        # cases exercising a helper nothing called on the package. Third story
        # running for that shape of bug, so the split is now the default.
        #
        # These are: exactly one module in the tree reads a clock, in any
        # spelling — an alias bound to the function, a `default_factory`, a
        # `getattr`, a rebound module, a `from` import (each of which walked
        # past the first scan); no module anywhere can infer where the main
        # sleeps from a prefix, an IP or a locale (a rule whose matrix row said
        # *asserted structurally* while nothing asserted it); nothing reads the
        # host's own zone through a bare `astimezone()` or a naive
        # `fromtimestamp`; the due time is identical whatever `TZ` the process
        # was started with, checked in subprocesses; an untrusted stamp — NaN,
        # infinity, negative, absurd, or not a number at all — is clamped into
        # the range `half.civil` will read back, and never escapes as an
        # exception; and everything the tick calls takes an injected `now`.
        #
        # 18 selected, 16 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock guarantee cases collected: $collected"
          if [ "$collected" -lt 16 ]; then
            echo "::error::the one-clock guarantee gate collected $collected cases; the rule is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock_guarantee

      - name: 'AD-5 and AD-30: retrieval degrades, and never writes'
        # The reranker fallback, the salience-is-derived assertions, the
        # no-clock scan, and the AD-3 discard-and-replay of an older derived
        # view all live here and were named by no gate.
        run: uv run --locked --extra dev pytest -q tests/test_retrieval.py
