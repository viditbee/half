name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run the suite
        run: uv run --locked --python ${{ matrix.python }} --extra dev pytest -q

  invariants:
    # AD-4 and AD-30 say these are enforced per commit rather than by
    # convention. They run in the suite above too — this job exists so a red
    # build names which invariant broke instead of saying "tests failed".
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 'AD-4: replay reproduces byte-identical state'
        run: uv run --locked --extra dev pytest tests/test_replay.py -q

      - name: 'AD-30: the fold is pure'
        run: uv run --locked --extra dev pytest tests/test_purity.py -q

      - name: 'AD-2: the runtime imports only stdlib and pinned dependencies'
        # Lives in the suite (tests/test_dependencies.py) rather than inline
        # here, so the gate itself is testable. The inline version checked
        # declaration rather than pinning and hardcoded one import-name
        # mapping, so it passed an unpinned dependency and failed a correctly
        # pinned one.
        run: uv run --locked --extra dev pytest tests/test_dependencies.py -q

      - name: 'AD-11: no secret material in the tree'
        # In the suite (tests/test_secret_gate.py) so the gate itself is
        # testable, matching the AD-2 step above. An inline version drifted
        # away from scan_for_secrets and stopped checking untracked files.
        run: uv run --locked --extra dev pytest tests/test_secret_gate.py -q

      - name: 'AD-24: retrieval weights and never excludes'
        # A topic switch that can empty the candidate set, or a cap that drops
        # beliefs without saying so, is what produces "I don't have access to
        # that" — the sentence the spec rejects outright.
        run: uv run --locked --extra dev pytest -q -m ad24

      - name: 'AD-18: licenses are enforced at context construction'
        # The real assertion, replacing story 4's interim ban rather than
        # deleting it: a `behave` or `ask` belief's claim text appears nowhere
        # in a constructed context or in a reply, asserted byte-wise over the
        # whole rendering — while `assert` text may now reach the main.
        # Marker-selected rather than file-selected, so this cannot go green
        # only because another step already ran one of the same files.
        #
        # The count is asserted because a marker gate has a silent failure
        # mode a passing run looks identical to: `pytest -m ad99` deselects
        # everything and exits 0, so a renamed or misspelled marker turns this
        # step green having asserted nothing. --strict-markers (pyproject)
        # catches the misspelling; the floor catches the rename, and catches
        # someone quietly unmarking the cases this gate exists for.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad18 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-18 cases collected: $collected"
          if [ "$collected" -lt 40 ]; then
            echo "::error::the AD-18 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad18

      - name: 'AD-28: one license ceiling, applied where licenses are resolved'
        # The ceiling is a single point of enforcement, which is exactly the
        # kind of invariant that decays quietly: nothing breaks when a new
        # surface resolves a license without it, the suite stays green, and
        # aftercare silently stops capping that surface. So this gate names it.
        #
        # Marker-selected rather than file-selected, for the same reason the
        # AD-18 step is: it must not go green because another step happened to
        # run one of the same files.
        #
        # The count is asserted for the reason the AD-18 step gives — a marker
        # gate that selects nothing exits 0 and looks identical to a passing
        # one. --strict-markers (pyproject) catches a misspelling; this floor
        # catches a rename, and catches someone quietly unmarking the cases
        # the gate exists for.
        #
        # The marker is applied case by case rather than file-wide, and the
        # floor sits just under the count for a reason the first version got
        # wrong: `pytestmark` marked the whole of test_ladder.py, so the count
        # included every rung, quarantine and promotion case — CAP-10, not
        # AD-28 — and every ceiling test could have been deleted with the step
        # still passing comfortably. 51 selected, 45 required: prune a
        # redundant case, do not gut the gate.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad28 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-28 cases collected: $collected"
          if [ "$collected" -lt 45 ]; then
            echo "::error::the AD-28 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad28

      - name: 'CAP-12: the crisis mode — the switch, the moment, the never-list'
        # The one path where a mistake is unrecoverable, so it gets a gate of
        # its own rather than living inside "tests failed". It covers the tier
        # table, the two actions and their two costs, the templated reply, the
        # never-list, the golden pins over the reviewed corpus, and the
        # C-SSRS-shaped escalating red-team suite.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18
        # and AD-28 steps give: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap12` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename, and catches someone quietly unmarking the
        # cases the gate exists for.
        #
        # **This gate is not clinical review.** The companion's build
        # requirement 6 is a qualified reviewer before launch, and a green run
        # here does not satisfy it or substitute for it. Story 6d makes that
        # sharper rather than softer: detection quality is now partly a model's,
        # and the label set and the instructions it is given are on the
        # reviewer's list beside the templates.
        #
        # The floor moved from 950 to 1240 across story 6d and its first
        # review round. It is deliberately above the count that would remain if
        # every classifier case were deleted, so hollowing that half out fails
        # twice — here, and at its own gates below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 cases collected: $collected"
          if [ "$collected" -lt 1240 ]; then
            echo "::error::the CAP-12 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12

      - name: 'CAP-12: crisis state survives eviction, restart and a full disk'
        # A second gate over a subset, because the first floor had a silent
        # failure mode that review found by arithmetic: it was set to exactly
        # the count remaining after deleting every durability case, so the
        # whole durable half of the story could be removed — the mode, the
        # ceiling and the retrieval disable all reverting to memory — with the
        # CAP-12 step still green and still above its floor.
        #
        # These are the cases driven through the real runtime and the real
        # store: the mode across a restart and an eviction, the ceiling in the
        # log, the retrieval switch rehydrated off, the entry record, the
        # operator reversal, and a reply still sent when the disk is full. A
        # subset with its own floor cannot be hollowed out by a floor set on
        # the superset.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_durable -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 durability cases collected: $collected"
          if [ "$collected" -lt 80 ]; then
            echo "::error::the durability gate collected $collected cases; the mode may no longer be durable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_durable

      - name: 'CAP-12: the warm handoff — confirmed, offered, drafted, never sent'
        # A third gate over a third subset, for the reason the durability gate
        # exists: a floor on the superset cannot stop the handoff being
        # hollowed out. The CAP-12 count is large enough that every one of
        # these cases could be deleted and that step would still pass
        # comfortably — and the half of the story that would go with them is
        # the half where a mistake reaches a third party.
        #
        # These are the cases for the confirmed list (an inferred candidate is
        # never offered, and neither is a quarantined one — offerability is the
        # ladder's whole answer), the two-or-three rule, the clinician door,
        # the region told and never inferred, the versioned directory and every
        # way it can degrade, the templated draft, the pinned row format, the
        # guard that splits the way the renderer joins, and the structural
        # assertion — globbed over the package, so a module written next year
        # is covered — that no crisis module has a send to a third party to
        # reach at all.
        #
        # **This gate is not clinical review**, and here that covers the data
        # as well as the code: build requirement 6 governs every entry in
        # `data/crisis-lines.json`, and a number that is right in shape and
        # wrong in fact passes every case below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_handoff -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 handoff cases collected: $collected"
          if [ "$collected" -lt 290 ]; then
            echo "::error::the handoff gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_handoff

      - name: 'CAP-12: aftercare — the floor, the steps, the answer, the held plan'
        # A fourth gate over a fourth subset, for the reason the durability and
        # handoff gates exist: a floor on the superset cannot stop this half
        # being hollowed out, and every case below could be deleted with the
        # CAP-12 step still green and still comfortably above its own floor.
        #
        # What it covers: that nothing restores inside the thirty-day floor by
        # any path; that reaching it grants one rung and never the lot; that
        # the second step has its own floor; that the mirror is *asked* for and
        # the cap holds until the main answers; that silence and a hedge are
        # both refused as consent; that a decline holds the cap and is not for
        # ever; that a second crisis restarts the floor from the later entry;
        # that the operator reversal still works and is deliberately not
        # stepwise; that the arithmetic is a pure function of two stamps with
        # no clock anywhere under `half/crisis`; and that a held safety plan
        # comes back word for word while there is exactly one expression in the
        # tree that could write one.
        #
        # **The floor carries a margin that is not the cases it protects.**
        # Review round 1 found the first version set to exactly the count left
        # after deselecting the twelve single-case property tests — the writer
        # gate, the quarantine rule, the unprompted-yes rule, the closed-set
        # plan guard, both quiet rules — so every one of them could be deleted
        # with all four gates green. That is story 6a's floor bug, one story
        # on. The floor is now well under the count *and* the property cases
        # carry their own marker and their own gate below, so deleting them
        # fails twice: their gate collects nothing, and this one drops beneath
        # its floor.
        #
        # **This gate is not clinical review.** Every wording it exercises —
        # the question Half puts before the mirror resumes, and the frame
        # around a document somebody else wrote — is on the reviewer's list,
        # and a green run here does not satisfy build requirement 6 or
        # substitute for it. Nor does it say the schedule itself is right: the
        # floor, the dwells and the two intervals are numbers a qualified
        # reviewer has to agree with, and this only proves the build honours
        # them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 aftercare cases collected: $collected"
          if [ "$collected" -lt 210 ]; then
            echo "::error::the aftercare gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare

      - name: 'CAP-12: the structural rules aftercare and the safety plan rest on'
        # The property cases, gated separately from the behavioural ones they
        # sit beside. Each is a single case asserting something no amount of
        # behaviour can show: that only one expression in the tree can write a
        # safety plan and that every call site hands it a value it was *given*;
        # that no module knows the shape of a plan; that nothing here reads a
        # clock, a tier or a payment state; that a restore names no target;
        # that a question Half never asked cannot be answered.
        #
        # A floor on the suite they belong to cannot protect them — they are a
        # fiftieth of it — which is exactly how the first version of the
        # aftercare gate came to have a floor equal to the count without them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare_property -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 property cases collected: $collected"
          if [ "$collected" -lt 45 ]; then
            echo "::error::the property gate collected $collected cases; the structural rules are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare_property

      - name: 'CAP-12: the second opinion — widens the question, never the mode'
        # A fifth gate over a fifth subset, for the reason the other four
        # exist: a floor on the superset cannot stop this half being hollowed
        # out, and this is the half where a *model* is in the loop on the one
        # path where a mistake is unrecoverable.
        #
        # What it covers: that the safe word and an explicit disclosure are
        # decided offline with no call made; that no label, no failure kind, no
        # reason, no timeout, no raise and no hand-built decision opens the
        # mode; that a model that ran and is unsure asks while a model that did
        # not run falls back to the table and is counted; that a held main and
        # an already-decided turn are never classified; that the only thing
        # leaving the machine is the message text, checked against the rendered
        # request with a seeded ledger, a confirmed contact and a told region on
        # disk; that no log call on this path can carry content; that the
        # holder the crisis path takes has no method that returns text; and
        # that the escalating red-team suite is green with the classifier
        # present *and* absent.
        #
        # **The structural cases have their own marker and their own gate**,
        # below. Review round 1 found that this floor's entire margin was the
        # twelve mutation-guard cases: deleting them, plus the ENTER/SURFACE
        # branch of ``_check_labels``, left this gate at exactly its floor and
        # ``cap12`` above its own — both green, with nothing left to refuse a
        # future label mapped to entering the mode. That is ``cap12_aftercare``
        # 's finding, one story on, so it gets the same fix: a subset marker
        # with a floor of its own, and this floor set above the count without
        # them.
        #
        # **This gate is not clinical review**, and here that covers the model
        # as well as the code: the label set, what each label permits, and the
        # instructions the model is given are all build requirement 6's
        # business, and no arrangement of green cases is evidence that the
        # classifier detects the right things.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_classifier -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 classifier cases collected: $collected"
          if [ "$collected" -lt 270 ]; then
            echo "::error::the classifier gate collected $collected cases; the second opinion is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_classifier

      - name: 'CAP-12: the structural rules the second opinion rests on'
        # The guarantee cases, gated apart from the behavioural ones they sit
        # beside, for the reason ``cap12_aftercare_property`` exists: a floor on
        # the suite they belong to cannot protect them, and review round 1
        # showed exactly that — the classifier floor's whole margin *was* these
        # cases, so they could be deleted together with the import-time check
        # that stops a model entering the mode, with every gate green.
        #
        # Each is a single case asserting something no amount of behaviour can
        # show: that a label mapped to ENTER or SURFACE is a *load* failure and
        # stays one under ``python -O``; that the holder is refused unless its
        # only public method is ``classify`` and it is not itself callable;
        # that the object holding it is sealed, so a wider one cannot be
        # assigned past the check; that a fallback that asks cannot be
        # constructed; that no module under ``half/crisis`` logs a traceback;
        # and that no log argument on this path can carry content.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_classifier_property -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 classifier property cases collected: $collected"
          if [ "$collected" -lt 28 ]; then
            echo "::error::the property gate collected $collected cases; the second opinion's structural rules are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_classifier_property

      - name: 'CAP-6: the open-loop ledger — the vocabulary, the timescale, the silence'
        # The ledger is the ranking function for everything Half does, and
        # every one of its rules is the kind that decays quietly: nothing
        # breaks the day a state is spelled two ways, a timescale acquires a
        # default, a movement date stops being validated, or silence starts
        # being stored instead of computed. The suite stays green and the
        # ranking is silently different. So this names it.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28 and CAP-12 steps are: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap6` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename.
        #
        # **A floor is the weakest of the three protections here, and review
        # proved it.** The first version was 92 collected against 80 required,
        # and deleting exactly the two AST guards the firewall rests on dropped
        # it to 90 — comfortably green, with the property unguarded. So the
        # firewall and the structural guards now carry their own markers and
        # their own gates below, *and* the cases each of those gates exists for
        # are named inside the suite itself
        # (`test_every_structural_guard_this_story_rests_on_still_exists`), so
        # deleting one fails by name rather than by arithmetic. 187 selected,
        # 160 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 cases collected: $collected"
          if [ "$collected" -lt 160 ]; then
            echo "::error::the CAP-6 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6

      - name: 'CAP-6: the refutation firewall — a wanting is never demoted or frozen'
        # A second gate over the subset that matters most, for the reason the
        # CAP-12 durability and handoff gates exist: a floor on the superset
        # cannot stop this half being hollowed out, and the half that would go
        # with it is the half where Half starts treating *"the main has done
        # nothing about the farmland for a year"* as evidence they never wanted
        # it.
        #
        # These are the cases for a retracted, revised and expunged support; a
        # correction that names the loop's own identifier; a tombstone that
        # shares it; a year of no evidence leaving the wanting standing; and —
        # added after review — that a loop left standing can **still move**.
        # That last one is not a refinement: one shared `expunged` set left a
        # loop present in the fold, passing every assertion above, while
        # silently dropping every later transition on it for ever. A wanting
        # that can never advance, be achieved, or change at all has been demoted
        # under another name.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_firewall -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 firewall cases collected: $collected"
          if [ "$collected" -lt 9 ]; then
            echo "::error::the firewall gate collected $collected cases; a loop may now be refutable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_firewall

      - name: 'CAP-6: the firewall as a property of the package, not a spelling'
        # A third gate, over the structural guards, and it exists because the
        # first version of this story had none worth the name. It asserted that
        # two `fold` case bodies did not contain the substring "loops" — a
        # spelling — and three mutations walked past it with all 1836 tests
        # green: a demotion in the `Op.TENSION` branch (Half lowering a wanting
        # because contradicting evidence arrived, the exact CAP-6 violation),
        # the same demotion moved into a module-scope helper, and a new
        # `half/loops/decay.py` exporting `demote`.
        #
        # What these assert instead: that only the transition case and the
        # loop-named expunge block may *name* the loop table inside `fold`;
        # that nothing anywhere under `half/` mutates it outside those two
        # places, by any of the seven ways a dict can be changed; and that only
        # the ledger can compose a record carrying both a loop and a state, in
        # either of the two shapes such a record gets built. Each runs against
        # a synthetic bypass of its own, so none can pass having seen nothing.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 structural cases collected: $collected"
          if [ "$collected" -lt 12 ]; then
            echo "::error::the structural gate collected $collected cases; the firewall is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_structure

      - name: 'AD-9: a due-time queue, never a cron'
        # Nothing else in the product runs on a schedule, so every rule here is
        # one that decays in silence: nothing breaks the day the grace window
        # widens into a catch-up, the concurrency bound stops being applied, the
        # file lock is dropped because "one worker anyway", or jitter becomes a
        # `random` draw that loses the spread on every restart. The suite stays
        # green and a thousand mains quietly share an instant — or wake up to a
        # week of yesterday's thoughts at once.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12 and CAP-6 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review round 1 had to establish for the third story running. 109
        # selected, 95 required — and the twenty-nine guarantee cases are
        # marked separately and gated below, so deleting them lands on 80 and
        # fails *twice*: their own gate collects nothing, and this one drops
        # beneath its floor. The one-clock cases are inside this count too, for
        # the same reason.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 cases collected: $collected"
          if [ "$collected" -lt 95 ]; then
            echo "::error::the AD-9 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9

      - name: 'AD-9: the promises inside the queue'
        # A second gate over the subset that carries the story, for the reason
        # the CAP-12 durability and CAP-6 firewall gates exist. These are the
        # cases a mutation has actually been run against, each failing by name:
        #
        #   catch-up on a missed window, through `tick` *and* through
        #   `run_forever` (a startup `_catch_up()` was green across 2002 tests);
        #   `while True` replaced by one iteration; the loop's `except` replaced
        #   by `raise`; `ScheduleError` swallowed; an unbounded semaphore; the
        #   shipped bound, timeout and grace at absurd values; `flock` removed;
        #   `_is_contention` returning True; `note_pass` bypassing the per-main
        #   mutex; `_advance` swallowing a failed write and running the pass
        #   anyway; jitter added to a resolved 03:00 rather than placed inside
        #   the real window (eighteen zones at 05:57 local on the EET spring
        #   transition); `DERIVED_VERSION` reverted; the fold's fatal branch
        #   deleted; and `ticker.cancel()` inserted after `create_task` in
        #   `serve`.
        #
        # 29 selected, 25 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 guarantee cases collected: $collected"
          if [ "$collected" -lt 25 ]; then
            echo "::error::the AD-9 guarantee gate collected $collected cases; the promises are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9_guarantee

      - name: 'AD-30: one clock reader, and a zone that is told'
        # The structural half of story 9a: the scans, and the non-vacuity cases
        # that feed each scan every shape it must see. A behavioural test cannot
        # cover any of it — a scheduler reading the host zone agrees with every
        # other case in the suite on a machine set to UTC, and a second clock
        # reader breaks nothing until two subsystems disagree about what "today"
        # is, a year later.
        #
        # 40 selected, 30 required, with the eighteen guarantee cases gated
        # separately below: deleting them lands on 22 and fails both steps.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock-reader cases collected: $collected"
          if [ "$collected" -lt 30 ]; then
            echo "::error::the one-clock gate collected $collected cases; a second clock reader is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock

      - name: 'AD-30: the sentences the one-clock rule exists to make true'
        # The guarantee subset, because review round 1 found the first version
        # of the one-clock floor sized so that deleting exactly the three
        # guarantee cases landed on it and passed — leaving eight non-vacuity
        # cases exercising a helper nothing called on the package. Third story
        # running for that shape of bug, so the split is now the default.
        #
        # These are: exactly one module in the tree reads a clock, in any
        # spelling — an alias bound to the function, a `default_factory`, a
        # `getattr`, a rebound module, a `from` import (each of which walked
        # past the first scan); no module anywhere can infer where the main
        # sleeps from a prefix, an IP or a locale (a rule whose matrix row said
        # *asserted structurally* while nothing asserted it); nothing reads the
        # host's own zone through a bare `astimezone()` or a naive
        # `fromtimestamp`; the due time is identical whatever `TZ` the process
        # was started with, checked in subprocesses; an untrusted stamp — NaN,
        # infinity, negative, absurd, or not a number at all — is clamped into
        # the range `half.civil` will read back, and never escapes as an
        # exception; and everything the tick calls takes an injected `now`.
        #
        # 18 selected, 16 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock guarantee cases collected: $collected"
          if [ "$collected" -lt 16 ]; then
            echo "::error::the one-clock guarantee gate collected $collected cases; the rule is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock_guarantee

      - name: 'CAP-7: the tension ledger — the vocabulary, the drift, the pass'
        # *Drift is tension velocity* is one of the three metrics the product
        # is measured on, and every rule that makes it trustworthy is the kind
        # that decays in silence: nothing breaks the day a state is spelled two
        # ways, a threshold starts deciding widening, a model gets asked
        # instead of the log, a transition replaces the mint instead of merging
        # over it, or the nightly pass stops being idempotent. The suite stays
        # green and a main is told their life is drifting on a number two
        # builds would disagree about.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12, CAP-6, AD-9 and AD-19 steps are: it must not go green
        # because another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review has had to establish for five stories running. 327
        # selected, 286 required — and the 147 guarantee cases are marked
        # separately and gated below, so deleting them lands on 180 and fails
        # *three* times: both subset gates collect nothing, and this one drops
        # 106 beneath its floor. The margin, 40, is deliberately far smaller
        # than the guarantee count, so the slack cannot be absorbed by deleting
        # guarantees — which is what review round 2 measured happening on the
        # AD-19 gate.
        #
        # **Review round 1 of this story found that a floor is not enough on
        # its own, twice over.** A tension frozen on its first transition — two
        # separate one-line mutations in ``widening.drift`` — passed all 2950
        # cases, because every case that drove a state change started from a
        # `fresh` tension. And the Ask-First threshold this story forbids could
        # be inserted into ``ledger.plan``, one layer above the guard that
        # forbids it, with the same result. Both are now named cases inside the
        # suite (``test_every_movement_case_this_story_rests_on_still_exists``),
        # so deleting one fails by name rather than by arithmetic.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 cases collected: $collected"
          if [ "$collected" -lt 286 ]; then
            echo "::error::the CAP-7 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7

      - name: 'CAP-7: a correction resolves a tension and never deletes one'
        # A second gate over the subset that carries the story's most invertible
        # rule, for the reason the CAP-6 firewall gate exists — and this is that
        # firewall's deliberate **inverse**. A loop is a wanting, which evidence
        # cannot refute, so the correction path is structurally unable to reach
        # it; a tension is a claim about *two entries*, so retracting one of
        # them genuinely ends the disagreement and the correction path must
        # reach it. Each rule applied to the other's object is a
        # plausible-looking line, which is why both are written down and both
        # are gated.
        #
        # And the inverse of story 8's own hole is gated with them. That
        # firewall passed its AST check while a demotion travelled through
        # `state.expunged` instead of `state.loops` — a loop present in the
        # fold, which every case asserted, and silently unable to move again.
        # The equivalent here is a correction that resolves a tension *and also*
        # drops it, which is indistinguishable from correct behaviour to any
        # case that only reads the state afterwards. So every case below
        # asserts the tension is present **by id** after retract, revise and
        # expunge, keeps its pair and its license, is absent from the expunged
        # set, and comes back from a rebuild.
        #
        # **And `resolved` is terminal by every route, which review round 1
        # found it was not.** A correction resolved a tension, a later
        # ``tension`` append carrying any live state merged straight over it,
        # and the tension came back live from a rebuild — while
        # ``half/tensions/states.py`` said in prose that there is no path from
        # `resolved` back to any other state. The expunge path had a guard and a
        # case; this one had neither. A tension *minted over a side that was
        # already gone* was the same hole from the other end: the fold only
        # resolved while folding the correction, so a mint that arrived
        # afterwards folded live and the pass computed drift across an entry
        # that does not exist.
        #
        # 29 selected, 24 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_resolution -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 resolution cases collected: $collected"
          if [ "$collected" -lt 24 ]; then
            echo "::error::the resolution gate collected $collected cases; a correction may now delete a tension"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_resolution

      - name: 'CAP-7: neither side of a tension is wrong'
        # A third gate, over the guards that have to fail when a ranking is
        # **added** rather than merely pass because none exists. That
        # distinction is the whole lesson of story 6c's no-authoring rule,
        # which forbade three spellings of *writing* a field and let the
        # content be composed elsewhere and handed to the blessed writer.
        #
        # So there are four layers, each with its own synthetic bypass: the
        # append gate refuses a ranked field outright, on every spelling and
        # through all three ways a record is built; the drift computation is
        # asserted symmetric under swapping the pair, over the whole matrix of
        # states and accumulation patterns; no expression in the tension
        # surface may index the pair positionally or sort, max or min over it;
        # and no name, argument, attribute, keyword or dict key in that surface
        # may come from the vocabulary of ranking. Twenty mutations were run
        # against them before this gate was written — a winner field on the
        # ledger, on the pass and in the fold's resolution; a computation that
        # prefers the first side; a comparator that orders the pair and changes
        # no output; a whole new `half/tensions/rank.py`; and the side composed
        # under an innocent name and handed to the blessed writer. Every one is
        # red.
        #
        # Salience is gated here too, and deliberately: this story builds no
        # decay, because story 4 made salience computed with a ninety-day
        # half-life. The way that regresses is a counter stored on a tension
        # for the pass to mutate — the exact AD-30 violation story 4 avoided,
        # arriving one object over — so the pass's whole append vocabulary is
        # pinned to one field and the half-life is pinned by value.
        #
        # **Review round 1 found three holes in this gate and they are all
        # closed here.** The ranked-field check matched *exact strings*, so
        # ``winner`` failed and ``winner_id``, ``winning_side``, ``is_winner``,
        # ``side_that_won``, ``more_credible``, ``truer_side``, ``moved_side``
        # and ``which_moved`` were every one of them accepted and durable —
        # including ``moved_side``, which is the line ``widening.py`` itself
        # names as the likely breach. The same exact-string rule was the module
        # scan, so ``def stronger_side(tension)`` in the tension package left
        # the whole suite green: the guard covered what a record carries and not
        # what a module offers, and it needed both. And every scan read
        # ``half/tensions`` and ``half/consolidate`` only, while this story
        # wrote tension code into the fold, the append gate and the registry —
        # ``held["winner"] = pair[0]`` injected into the fold's merge branch
        # passed all 2950 cases. That is story 8's hole exactly: the guard
        # passed because the violation travelled through a module it did not
        # cover.
        #
        # **This gate's whole margin used to be absorbable by shrinking the set
        # it guards.** The largest case expands over ``RANKED_FIELDS`` one for
        # one, and nothing pinned it: deleting twelve entries landed the gate on
        # exactly its floor, green, with ``loser=`` and ``ranked=`` appending
        # cleanly. The set is pinned by value now, the way the persistence
        # window is.
        #
        # 118 selected, 100 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_neutrality -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 neutrality cases collected: $collected"
          if [ "$collected" -lt 100 ]; then
            echo "::error::the neutrality gate collected $collected cases; a tension may now rank its two sides"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_neutrality

      - name: 'CAP-8: the morning surface — one a day, traceable, or silence'
        # Nothing else in the product speaks first, so every rule here is one
        # that decays in silence: nothing breaks the day the one-a-day rule
        # becomes twenty-four hours instead of the main's own civil day, the
        # traceability check learns to accept a candidate that cites nothing,
        # the surface starts reaching into the ledger when a pass found
        # nothing, or *sending* quietly becomes the only success case. The
        # suite stays green and a main gets a cheerful daily message, which is
        # the product this one exists not to be.
        #
        # Marker-selected rather than file-selected, for the reason the AD-9,
        # CAP-6, CAP-7 and CAP-12 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review has had to establish for four stories running. 148
        # selected, 120 required — and the two halves that carry the story are
        # marked separately and gated below, at 67 and 57 cases. Either
        # deletion therefore fails *twice*: its own gate collects nothing, and
        # this one drops far beneath its floor, because the margin here (28) is
        # smaller than the smaller of the two subsets.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 cases collected: $collected"
          if [ "$collected" -lt 120 ]; then
            echo "::error::the CAP-8 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8

      - name: 'CAP-8: silence is the ordinary outcome, and the ceiling holds it'
        # A second gate over the half that carries the story, for the reason the
        # CAP-12 durability, CAP-6 firewall and CAP-7 resolution gates exist: a
        # floor on the superset cannot stop this half being hollowed out.
        #
        # What it covers: that a quiet night sends nothing and logs no warning;
        # that a pass which moved nothing produces no candidate at all, so most
        # days are silent by construction rather than by a check; that a
        # candidate which cannot cite the preceding pass is not surfaced under
        # any of six shapes; that crisis, an already-spent day, an unreachable
        # platform, a `behave` ceiling and the nagging bound each silence a
        # morning **alone**, and every pair of them in both orders; that a main
        # capped at `behave` receives nothing at every rung on the ladder, swept
        # over ``ladder.RUNGS`` so a fourth rung is covered the day it exists;
        # and that a touch which could not be written stops the send.
        #
        # **And the two structural cases that make the ceiling a property
        # rather than an anecdote.** A single behavioural case with a capped
        # main passes just as happily against an ``if in_aftercare: return
        # Silence(...)`` branch, which is the implementation AD-28 exists to
        # forbid. So the surface's ledger protocol is pinned to four doors,
        # none of which can answer a question about aftercare; nothing under
        # ``half/surface/`` may import anything that could; and every call in
        # the package to a function that resolves a rung — the set **derived
        # from the ladder itself**, so a new resolver is covered on the day it
        # is written — must pass a ceiling. Together those mean a new surface
        # cannot be written that bypasses the cap, which is the sentence AD-28
        # is made of.
        #
        # 67 selected, 55 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_silence -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 silence cases collected: $collected"
          if [ "$collected" -lt 55 ]; then
            echo "::error::the CAP-8 silence gate collected $collected cases; silence is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_silence

      - name: 'CAP-10: a loop is never touched faster than its own timescale'
        # The nagging bound, gated beside the surface rather than inside it,
        # because it is the rule that decays most quietly: a bound that stopped
        # bounding would show up as a Half that is slightly more talkative, and
        # nothing else, for months.
        #
        # What it covers: that the bound is derived from each loop's *own*
        # period, swept over all four timescales against one interval so a
        # single shared cooldown — the reference implementation's shape — fails
        # by name; that both sides of the boundary are pinned at every
        # timescale, so `>` cannot silently become `>=` or a fortnight; that
        # every way the bound cannot be computed refuses rather than permits,
        # including a loop with no period at all, which is *not* raised even
        # the first time; that a raise is recorded as an append, superseded per
        # loop, erased with the loop, and keyed on a record id carrying no
        # slug; and that a touch may carry nothing but the loop and its
        # citation.
        #
        # **Plus the wall, asserted by AST in both directions.** The module
        # that writes a raise cannot name a movement date or a state, the
        # open-loop package cannot name a raise, and the fold's touch case
        # cannot reach the loop table. Story 8 refused to record Half's own
        # contact precisely because conflating it with the main's progress is
        # the mistake one helpful line makes, and a behavioural test cannot see
        # that line until a year of nudges has been read back as a year of
        # advancement.
        #
        # 57 selected, 48 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_nagging -q --collect-only \
            | grep -c '::' || true)
          echo "nagging-bound cases collected: $collected"
          if [ "$collected" -lt 48 ]; then
            echo "::error::the nagging gate collected $collected cases; the bound is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_nagging

      - name: 'AD-5 and AD-30: retrieval degrades, and never writes'
        # The reranker fallback, the salience-is-derived assertions, the
        # no-clock scan, and the AD-3 discard-and-replay of an older derived
        # view all live here and were named by no gate.
        run: uv run --locked --extra dev pytest -q tests/test_retrieval.py

      - name: 'AD-19: one model port, cache breakpoints first-class'
        # The model port is the first thing in Half that can spend money and
        # the first that can author text, and every rule in it decays quietly:
        # nothing breaks the day a `generate` appears on the classifier, a
        # model name is written into a call site, a breakpoint is clamped to
        # where it would fit, a failure collapses two of the four kinds into
        # one, or a budget starts being checked after the call instead of
        # before it. The suite stays green and the free tier's cost model is
        # silently different — or a main in crisis is answered by something
        # that authored the words.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12, CAP-6 and AD-9 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review has had to establish for four stories running. 330
        # selected, 290 required — and the margin is deliberately smaller than
        # the 120 non-guarantee cases, so the slack cannot be absorbed by
        # deleting guarantees, which is what review round 2 measured happening
        # on the gate below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad19 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-19 cases collected: $collected"
          if [ "$collected" -lt 290 ]; then
            echo "::error::the AD-19 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad19

      - name: 'AD-19: the promises inside the port'
        # The subset that carries the story, gated separately for the reason
        # the CAP-12 durability, CAP-6 firewall and AD-9 guarantee gates exist:
        # a floor on the superset cannot stop this half being hollowed out, and
        # the half that would go with it is the half where the rules are
        # properties rather than spellings.
        #
        # These are the cases a mutation has actually been run against, each
        # failing by name. From the first round: a classify-only holder with
        # exactly one public method (and a synthetic subclass that adds a
        # `generate`); no model named outside the tier table; a breakpoint
        # placed where the caller put it and refused rather than clamped when
        # it will not fit; the four failures distinct and none carrying a
        # substituted answer; an over-budget call refused with nothing sent;
        # one ledger shared by every holder; a submission collected by a
        # different provider; no model reachable from a fold, transitively.
        #
        # From review round 1, each reproduced before it was fixed:
        #
        #   the pass ceiling binding at the scheduler's own DEFAULT_BOUND
        #   (eight admitted against a three-call ceiling before admission
        #   reserved); a non-Latin estimate at or above one token per
        #   character, per script (300 CJK characters priced identically to
        #   300 Latin); the AD-22 scan reading argument zero, with nine
        #   bypasses including the f-string that walked past all 122 cases of
        #   the first gate; the classify-only holder exposing no attribute at
        #   all, so the crisis path's object cannot reset the pass ledger; a
        #   one-hour cache write charged at the one-hour basis; every declared
        #   Reason produced by some path; Failure.spent truthful per reason; a
        #   batch state this build cannot read stopping the polling; a
        #   mid-stream failure keeping the rows already read; the pass total
        #   surviving a restart the way the submission does; every rendered
        #   wire shape checked against the SDK's own typed parameters rather
        #   than against the renderer; every stop reason the SDK declares
        #   handled; and the model table pinned to its absolute values.
        #
        # And from review round 2, each reproduced before it was fixed:
        #
        #   a reservation released on every path out — round 1's own
        #   cache-minimum refusal raised from the renderer, which sat after
        #   `admit` and outside any handler, so five retries of a mis-stated
        #   breakpoint drained the pass and every honest call after it was
        #   refused with nothing sent; a reservation exchangeable exactly once
        #   and only by its issuer (a double settle recorded 120 against a 100
        #   ceiling, a foreign one settled clean, a hand-made one freed the
        #   ledger through a `max(0, …)` clamp); the cache-minimum refusal
        #   itself, which `if False:` could disable with all 2,316 tests green;
        #   the nested message and system-block shapes, where two guaranteed
        #   400s both passed because the scan read only the top level; a
        #   relative import of the port into the fold, which passed both AD-30
        #   scans; and the model-name scan's call route.
        #
        # **The floor is no longer the only protection, and round 2 is why.**
        # Every case this gate selects is a guarantee case, so its margin could
        # only ever be absorbed by deleting guarantees — measured: dropping
        # eight of them left both gates green. So the flagship cases are now
        # named one by one inside the suite
        # (`test_every_guarantee_this_story_rests_on_still_exists`), the way
        # `tests/test_loops.py` names the guards its firewall rests on.
        # Deleting one fails by name; deleting the naming case drops this gate
        # 36 cases and fails by arithmetic.
        #
        # 210 selected, 195 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad19_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "AD-19 guarantee cases collected: $collected"
          if [ "$collected" -lt 195 ]; then
            echo "::error::the AD-19 guarantee gate collected $collected cases; the promises are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad19_guarantee

      - name: 'The suite reaches no network, asserted at the socket'
        # Its own step, because it is the only gate in the tree that is not a
        # statement about Half's code: it is a statement about every test, and
        # it is the one that would notice an SDK constructed for real wherever
        # somebody wrote it.
        #
        # It runs the whole suite in a subprocess with every spelling of
        # `connect` — and of name resolution, which is what an SDK reaches
        # first — replaced by something that raises. The guard goes in through
        # `sitecustomize`, so the subprocesses the suite spawns of its own are
        # covered too.
        #
        # The floor covers the non-vacuity cases as well as the run: a guard
        # nobody has tried to defeat is a guard resting on nothing, so five of
        # these are deliberate bypasses, one per way of reaching out, plus the
        # child-process case, the one that closes the recursion the first
        # version of this file opened, and — since review round 1 — the case
        # that proves the implementation module is free of the SDK entirely,
        # which is why the transport is a module of its own.
        # 14 selected, 11 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m offline -q --collect-only \
            | grep -c '::' || true)
          echo "offline cases collected: $collected"
          if [ "$collected" -lt 11 ]; then
            echo "::error::the offline gate collected $collected cases; the suite may now reach the network"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m offline
