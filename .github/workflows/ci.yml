        #
        # 40 selected, 30 required, with the eighteen guarantee cases gated
        # separately below: deleting them lands on 22 and fails both steps.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock-reader cases collected: $collected"
          if [ "$collected" -lt 30 ]; then
            echo "::error::the one-clock gate collected $collected cases; a second clock reader is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock

      - name: 'AD-30: the sentences the one-clock rule exists to make true'
        # The guarantee subset, because review round 1 found the first version
        # of the one-clock floor sized so that deleting exactly the three
        # guarantee cases landed on it and passed — leaving eight non-vacuity
        # cases exercising a helper nothing called on the package. Third story
        # running for that shape of bug, so the split is now the default.
        #
        # These are: exactly one module in the tree reads a clock, in any
        # spelling — an alias bound to the function, a `default_factory`, a
        # `getattr`, a rebound module, a `from` import (each of which walked
        # past the first scan); no module anywhere can infer where the main
        # sleeps from a prefix, an IP or a locale (a rule whose matrix row said
        # *asserted structurally* while nothing asserted it); nothing reads the
        # host's own zone through a bare `astimezone()` or a naive
        # `fromtimestamp`; the due time is identical whatever `TZ` the process
        # was started with, checked in subprocesses; an untrusted stamp — NaN,
