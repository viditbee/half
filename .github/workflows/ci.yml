name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run the suite
        run: uv run --locked --python ${{ matrix.python }} --extra dev pytest -q

  invariants:
    # AD-4 and AD-30 say these are enforced per commit rather than by
    # convention. They run in the suite above too — this job exists so a red
    # build names which invariant broke instead of saying "tests failed".
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 'AD-4: replay reproduces byte-identical state'
        run: uv run --extra dev pytest tests/test_replay.py -q

      - name: 'AD-30: the fold is pure'
        run: uv run --extra dev pytest tests/test_purity.py -q

      - name: 'AD-2: the runtime imports only stdlib and pinned dependencies'
        # Lives in the suite (tests/test_dependencies.py) rather than inline
        # here, so the gate itself is testable. The inline version checked
        # declaration rather than pinning and hardcoded one import-name
        # mapping, so it passed an unpinned dependency and failed a correctly
        # pinned one.
        run: uv run --extra dev pytest tests/test_dependencies.py -q

      - name: 'AD-11: the committed tree carries no secret material'
        # Scans exactly what git tracks, rather than the working directory with
        # a growing list of exclusions. The claim is about what ships, and a
        # build artefact appearing under a new name should not be able to
        # weaken the gate or to fail it spuriously.
        run: |
          uv run python - <<'PY'
          import pathlib, subprocess, sys
          from half.store.export import SECRET_PATTERNS
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.split(b"\0")
          findings = []
          for name in filter(None, tracked):
              path = pathlib.Path(name.decode())
              if not path.is_file():
                  continue
              text = path.read_bytes().decode("utf-8", errors="replace")
              for label, pattern in SECRET_PATTERNS:
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      findings.append(f"{label} at {path}:{line}")
          if findings:
              sys.exit("secret material in tracked files:\n  " + "\n  ".join(findings))
          print(f"{len(tracked)} tracked files scan clean")
          PY
