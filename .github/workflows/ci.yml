name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run the suite
        run: uv run --locked --python ${{ matrix.python }} --extra dev pytest -q

  invariants:
    # AD-4 and AD-30 say these are enforced per commit rather than by
    # convention. They run in the suite above too — this job exists so a red
    # build names which invariant broke instead of saying "tests failed".
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 'AD-4: replay reproduces byte-identical state'
        run: uv run --locked --extra dev pytest tests/test_replay.py -q

      - name: 'AD-30: the fold is pure'
        run: uv run --locked --extra dev pytest tests/test_purity.py -q

      - name: 'AD-2: the runtime imports only stdlib and pinned dependencies'
        # Lives in the suite (tests/test_dependencies.py) rather than inline
        # here, so the gate itself is testable. The inline version checked
        # declaration rather than pinning and hardcoded one import-name
        # mapping, so it passed an unpinned dependency and failed a correctly
        # pinned one.
        run: uv run --locked --extra dev pytest tests/test_dependencies.py -q

      - name: 'AD-11: no secret material in the tree'
        # In the suite (tests/test_secret_gate.py) so the gate itself is
        # testable, matching the AD-2 step above. An inline version drifted
        # away from scan_for_secrets and stopped checking untracked files.
        run: uv run --locked --extra dev pytest tests/test_secret_gate.py -q

      - name: 'AD-24: retrieval weights and never excludes'
        # A topic switch that can empty the candidate set, or a cap that drops
        # beliefs without saying so, is what produces "I don't have access to
        # that" — the sentence the spec rejects outright.
        run: uv run --locked --extra dev pytest -q -m ad24

      - name: 'AD-18: licenses are enforced at context construction'
        # The real assertion, replacing story 4's interim ban rather than
        # deleting it: a `behave` or `ask` belief's claim text appears nowhere
        # in a constructed context or in a reply, asserted byte-wise over the
        # whole rendering — while `assert` text may now reach the main.
        # Marker-selected rather than file-selected, so this cannot go green
        # only because another step already ran one of the same files.
        #
        # The count is asserted because a marker gate has a silent failure
        # mode a passing run looks identical to: `pytest -m ad99` deselects
        # everything and exits 0, so a renamed or misspelled marker turns this
        # step green having asserted nothing. --strict-markers (pyproject)
        # catches the misspelling; the floor catches the rename, and catches
        # someone quietly unmarking the cases this gate exists for.
        #
        # **The floor moves with the count so the margin does not grow.** Story
        # 11 added ten, and they belong to this invariant: the question channel
        # is now filled by a *purchase* rather than by a rung, which changes what
        # one of AD-18's three channels means. An unbought `ask` belief becomes a
        # directive (so nothing is filtered away — AD-18's second named failure),
        # a context has room for exactly one question, and only one expression in
        # the tree may build one.
        #
        # **The forty-eight-case truth table is deliberately *not* here.** It is
        # story 11's guard on bought-ness, and carrying it into this gate took
        # the count from 55 to 113 while adding no AD-18 coverage at all — a
        # floor that reports itself twice as well covered as it is, which is a
        # floor telling a lie. It is gated by `cap4_bought` at margin zero.
        #
        # **Story 13a adds nine, and the floor moves with them.** A model now
        # writes the morning, which is the first time in this tree that AD-18's
        # *"never by filtering generated text"* has generated text to be about.
        # The nine are the construction rule at the prompt — the quotable block
        # and the shaping block built by two functions from two fields, a
        # `behave` claim nowhere in the prompt at all, no belief id reaching it
        # — and the five that make the verbatim tripwire a smoke alarm rather
        # than enforcement: it fires on a fragment, it is loud, it buys no
        # regeneration, and no function in the module returns text, so there is
        # nothing there that could redact.
        #
        # **The twenty-eight language-sample cases are deliberately *not* here.**
        # They are story 13a's own rule — a language signal that can never become
        # content — and no rung governs a language. Marking them would take this
        # gate from 78 to 106 while adding two rules' worth of AD-18 coverage,
        # which is story 11's forty-eight-case truth table arriving under a
        # different name. They are gated by `cap8_voice`, at margin zero.
        #
        # Review round 1 added four more: a leak must not arm the breaker, nor
        # must a raise, a leak must be caught even when the judge would also
        # refuse, and the tripwire must not be switchable off by omission. Each
        # of the four was a live route by which an AD-18 breach went quiet.
        #
        # **Story 13b's review loop adds one**: a reply is still produced when
        # nothing is quotable. It belongs here because it is the *other* half of
        # AD-18's second named failure — material a rung does not permit must
        # not be filtered away, and a context left with nothing quotable must
        # still produce a reply rather than silence. It was removed during that
        # story's first build and restored by the second review-loop amendment.
        #
        # 79 selected, 64 required. **The margin is fifteen and it is not zero
        # on purpose**: several cases here are neighbours inside one sweep — the
        # nine malformed-license parameters, the script cases — so pruning a
        # redundant parameter should be possible without editing this number,
        # while gutting the gate should not.
        #
        # **What the margin does *not* do is protect any fifteen named cases**,
        # and an earlier revision of this comment claimed it did. A floor fifteen
        # under the count cannot stop the byte-wise leak guard, the
        # rendering-completeness enumeration or story 13a's construction cases
        # being deleted — nothing about a superset floor ever could. Story 13a's
        # are protected by `cap8_voice` at margin zero; the older single-case
        # rules are protected by this floor only in the weak sense that deleting
        # enough of them together drops the count.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad18 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-18 cases collected: $collected"
          if [ "$collected" -lt 64 ]; then
            echo "::error::the AD-18 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad18

      - name: 'AD-28: one license ceiling, applied where licenses are resolved'
        # The ceiling is a single point of enforcement, which is exactly the
        # kind of invariant that decays quietly: nothing breaks when a new
        # surface resolves a license without it, the suite stays green, and
        # aftercare silently stops capping that surface. So this gate names it.
        #
        # Marker-selected rather than file-selected, for the same reason the
        # AD-18 step is: it must not go green because another step happened to
        # run one of the same files.
        #
        # The count is asserted for the reason the AD-18 step gives — a marker
        # gate that selects nothing exits 0 and looks identical to a passing
        # one. --strict-markers (pyproject) catches a misspelling; this floor
        # catches a rename, and catches someone quietly unmarking the cases
        # the gate exists for.
        #
        # The marker is applied case by case rather than file-wide, and the
        # floor sits just under the count for a reason the first version got
        # wrong: `pytestmark` marked the whole of test_ladder.py, so the count
        # included every rung, quarantine and promotion case — CAP-10, not
        # AD-28 — and every ceiling test could have been deleted with the step
        # still passing comfortably. 51 selected, 45 required: prune a
        # redundant case, do not gut the gate.
        #
        # **The floor moves with the count so the margin does not grow.** The
        # gate stood at 51 selected / 45 required — a margin of six. Story 5b
        # added seven cases (the unasked queue is a new surface, and a new
        # surface that resolves a license is exactly what this gate exists to
        # catch), so the floor moves to 58 − 6 = 52. Leaving it at 45 would
        # have widened the margin to thirteen, which is how a gate quietly
        # acquires room to lose the cases it was written for.
        #
        # **A margin of six still cannot protect any six specific cases**, and
        # review was right to say so: this floor does not, on its own, stop
        # story 5b's ceiling cases being deleted. Nothing about a superset floor
        # ever could. They are protected by ``cap4_gates``, whose margin is
        # zero — which is the pattern this file already uses for
        # ``cap6_structure`` and ``cap12_aftercare_property``.
        #
        # 59 selected, 53 required. Story 11 added **one**: a main capped at
        # `behave` buys no question however much has been delivered. The floor
        # moves with it so the margin stays at six, and the meaning of that
        # margin is the one this comment already gives — prune a redundant case,
        # do not gut the gate.
        #
        # Story 11's truth table sweeps every ceiling on the ladder and is
        # deliberately **not** marked here. It would have taken this gate from 58
        # to 107 while adding one case of AD-28 coverage, so a later reader would
        # find a floor claiming twice the protection it has. It is gated by
        # `cap4_bought`, at margin zero.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad28 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-28 cases collected: $collected"
          if [ "$collected" -lt 53 ]; then
            echo "::error::the AD-28 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad28

      - name: 'CAP-12: the crisis mode — the switch, the moment, the never-list'
        # The one path where a mistake is unrecoverable, so it gets a gate of
        # its own rather than living inside "tests failed". It covers the tier
        # table, the two actions and their two costs, the templated reply, the
        # never-list, the golden pins over the reviewed corpus, and the
        # C-SSRS-shaped escalating red-team suite.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18
        # and AD-28 steps give: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap12` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename, and catches someone quietly unmarking the
        # cases the gate exists for.
        #
        # **This gate is not clinical review.** The companion's build
        # requirement 6 is a qualified reviewer before launch, and a green run
        # here does not satisfy it or substitute for it. Story 6d makes that
        # sharper rather than softer: detection quality is now partly a model's,
        # and the label set and the instructions it is given are on the
        # reviewer's list beside the templates.
        #
        # Story 5b added three: the mode suspends the trust currency, so a main
        # in it is asked nothing, and a main who enters it between the choice of
        # a question and the spend that pays for it is not asked either.
        #
        # **The floor is not what protects them, and an earlier revision of this
        # comment claimed it was.** This gate collects 1304 against a floor of
        # 1240 — a margin of sixty-one before and after — so all three could be
        # deleted with every step here green, and moving the floor by three
        # would have changed nothing. Arithmetic, not protection. They are gated
        # by ``cap4_gates`` instead, whose margin is zero, which is the same
        # answer ``cap12_durable`` and ``cap12_handoff`` gave for their own
        # subsets. The floor below stays where story 6d put it.
        #
        # The floor moved from 950 to 1240 across story 6d and its first
        # review round. It is deliberately above the count that would remain if
        # every classifier case were deleted, so hollowing that half out fails
        # twice — here, and at its own gates below.
        #
        # Story 11 added one — a crisis opening between the choice of a question
        # and the send spends no favour — and the floor moves with it to 1241 so
        # the margin does not grow. That case is protected by `cap4_gates`, whose
        # margin is zero, exactly as story 5b's three are.
        #
        # Story 9d added one more — a main in the mode is never minted for,
        # asserted through a real tick rather than by a second check inside the
        # pass — and the floor moves with it to 1242 for the same reason. It is
        # protected by `cap7_minting`, whose margin is zero, exactly as the
        # cases above are protected by `cap4_gates`.
        #
        # **Story 9d's review adds one and the floor moves with it, to 1243.**
        # A main crisis-suspended for a night used to resume with everything
        # they had said that night already behind the minter's watermark, for
        # ever, because the scheduler wrote one indistinguishable `schedule`
        # record for the main whose pass ran and for the suspended one whose
        # did not. The case drives it end to end through a real tick.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 cases collected: $collected"
          if [ "$collected" -lt 1243 ]; then
            echo "::error::the CAP-12 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12

      - name: 'CAP-12: crisis state survives eviction, restart and a full disk'
        # A second gate over a subset, because the first floor had a silent
        # failure mode that review found by arithmetic: it was set to exactly
        # the count remaining after deleting every durability case, so the
        # whole durable half of the story could be removed — the mode, the
        # ceiling and the retrieval disable all reverting to memory — with the
        # CAP-12 step still green and still above its floor.
        #
        # These are the cases driven through the real runtime and the real
        # store: the mode across a restart and an eviction, the ceiling in the
        # log, the retrieval switch rehydrated off, the entry record, the
        # operator reversal, and a reply still sent when the disk is full. A
        # subset with its own floor cannot be hollowed out by a floor set on
        # the superset.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_durable -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 durability cases collected: $collected"
          if [ "$collected" -lt 80 ]; then
            echo "::error::the durability gate collected $collected cases; the mode may no longer be durable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_durable

      - name: 'CAP-12: the warm handoff — confirmed, offered, drafted, never sent'
        # A third gate over a third subset, for the reason the durability gate
        # exists: a floor on the superset cannot stop the handoff being
        # hollowed out. The CAP-12 count is large enough that every one of
        # these cases could be deleted and that step would still pass
        # comfortably — and the half of the story that would go with them is
        # the half where a mistake reaches a third party.
        #
        # These are the cases for the confirmed list (an inferred candidate is
        # never offered, and neither is a quarantined one — offerability is the
        # ladder's whole answer), the two-or-three rule, the clinician door,
        # the region told and never inferred, the versioned directory and every
        # way it can degrade, the templated draft, the pinned row format, the
        # guard that splits the way the renderer joins, and the structural
        # assertion — globbed over the package, so a module written next year
        # is covered — that no crisis module has a send to a third party to
        # reach at all.
        #
        # **This gate is not clinical review**, and here that covers the data
        # as well as the code: build requirement 6 governs every entry in
        # `data/crisis-lines.json`, and a number that is right in shape and
        # wrong in fact passes every case below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_handoff -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 handoff cases collected: $collected"
          if [ "$collected" -lt 290 ]; then
            echo "::error::the handoff gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_handoff

      - name: 'CAP-12: aftercare — the floor, the steps, the answer, the held plan'
        # A fourth gate over a fourth subset, for the reason the durability and
        # handoff gates exist: a floor on the superset cannot stop this half
        # being hollowed out, and every case below could be deleted with the
        # CAP-12 step still green and still comfortably above its own floor.
        #
        # What it covers: that nothing restores inside the thirty-day floor by
        # any path; that reaching it grants one rung and never the lot; that
        # the second step has its own floor; that the mirror is *asked* for and
        # the cap holds until the main answers; that silence and a hedge are
        # both refused as consent; that a decline holds the cap and is not for
        # ever; that a second crisis restarts the floor from the later entry;
        # that the operator reversal still works and is deliberately not
        # stepwise; that the arithmetic is a pure function of two stamps with
        # no clock anywhere under `half/crisis`; and that a held safety plan
        # comes back word for word while there is exactly one expression in the
        # tree that could write one.
        #
        # **The floor carries a margin that is not the cases it protects.**
        # Review round 1 found the first version set to exactly the count left
        # after deselecting the twelve single-case property tests — the writer
        # gate, the quarantine rule, the unprompted-yes rule, the closed-set
        # plan guard, both quiet rules — so every one of them could be deleted
        # with all four gates green. That is story 6a's floor bug, one story
        # on. The floor is now well under the count *and* the property cases
        # carry their own marker and their own gate below, so deleting them
        # fails twice: their gate collects nothing, and this one drops beneath
        # its floor.
        #
        # **This gate is not clinical review.** Every wording it exercises —
        # the question Half puts before the mirror resumes, and the frame
        # around a document somebody else wrote — is on the reviewer's list,
        # and a green run here does not satisfy build requirement 6 or
        # substitute for it. Nor does it say the schedule itself is right: the
        # floor, the dwells and the two intervals are numbers a qualified
        # reviewer has to agree with, and this only proves the build honours
        # them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 aftercare cases collected: $collected"
          if [ "$collected" -lt 210 ]; then
            echo "::error::the aftercare gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare

      - name: 'CAP-12: the structural rules aftercare and the safety plan rest on'
        # The property cases, gated separately from the behavioural ones they
        # sit beside. Each is a single case asserting something no amount of
        # behaviour can show: that only one expression in the tree can write a
        # safety plan and that every call site hands it a value it was *given*;
        # that no module knows the shape of a plan; that nothing here reads a
        # clock, a tier or a payment state; that a restore names no target;
        # that a question Half never asked cannot be answered.
        #
        # A floor on the suite they belong to cannot protect them — they are a
        # fiftieth of it — which is exactly how the first version of the
        # aftercare gate came to have a floor equal to the count without them.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_aftercare_property -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 property cases collected: $collected"
          if [ "$collected" -lt 45 ]; then
            echo "::error::the property gate collected $collected cases; the structural rules are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_aftercare_property

      - name: 'CAP-12: the second opinion — widens the question, never the mode'
        # A fifth gate over a fifth subset, for the reason the other four
        # exist: a floor on the superset cannot stop this half being hollowed
        # out, and this is the half where a *model* is in the loop on the one
        # path where a mistake is unrecoverable.
        #
        # What it covers: that the safe word and an explicit disclosure are
        # decided offline with no call made; that no label, no failure kind, no
        # reason, no timeout, no raise and no hand-built decision opens the
        # mode; that a model that ran and is unsure asks while a model that did
        # not run falls back to the table and is counted; that a held main and
        # an already-decided turn are never classified; that the only thing
        # leaving the machine is the message text, checked against the rendered
        # request with a seeded ledger, a confirmed contact and a told region on
        # disk; that no log call on this path can carry content; that the
        # holder the crisis path takes has no method that returns text; and
        # that the escalating red-team suite is green with the classifier
        # present *and* absent.
        #
        # **The structural cases have their own marker and their own gate**,
        # below. Review round 1 found that this floor's entire margin was the
        # twelve mutation-guard cases: deleting them, plus the ENTER/SURFACE
        # branch of ``_check_labels``, left this gate at exactly its floor and
        # ``cap12`` above its own — both green, with nothing left to refuse a
        # future label mapped to entering the mode. That is ``cap12_aftercare``
        # 's finding, one story on, so it gets the same fix: a subset marker
        # with a floor of its own, and this floor set above the count without
        # them.
        #
        # **This gate is not clinical review**, and here that covers the model
        # as well as the code: the label set, what each label permits, and the
        # instructions the model is given are all build requirement 6's
        # business, and no arrangement of green cases is evidence that the
        # classifier detects the right things.
        #
        # **Story 14 adds one**: the hundredth wholly failing consultation
        # alarming at `error` rather than reporting at `info`. That branch was
        # wrong in three modules at once and story 13a fixed one of them; it is
        # now one branch in `half/model/consult.py`, and this case is how a
        # reader can see that the single fix reached the crisis path.
        # 294 selected, 271 required; the margin of 23 is unchanged.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_classifier -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 classifier cases collected: $collected"
          if [ "$collected" -lt 271 ]; then
            echo "::error::the classifier gate collected $collected cases; the second opinion is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_classifier

      - name: 'CAP-12: the structural rules the second opinion rests on'
        # The guarantee cases, gated apart from the behavioural ones they sit
        # beside, for the reason ``cap12_aftercare_property`` exists: a floor on
        # the suite they belong to cannot protect them, and review round 1
        # showed exactly that — the classifier floor's whole margin *was* these
        # cases, so they could be deleted together with the import-time check
        # that stops a model entering the mode, with every gate green.
        #
        # Each is a single case asserting something no amount of behaviour can
        # show: that a label mapped to ENTER or SURFACE is a *load* failure and
        # stays one under ``python -O``; that the holder is refused unless its
        # only public method is ``classify`` and it is not itself callable;
        # that the object holding it is sealed, so a wider one cannot be
        # assigned past the check; that a fallback that asks cannot be
        # constructed; that no module under ``half/crisis`` logs a traceback;
        # and that no log argument on this path can carry content.
        #
        # **Story 14 adds three**, each a single case asserting something no
        # amount of behaviour can show: which numbers are the shape's and which
        # are this main's, with the three policy numbers absent from the shape
        # entirely; that the shape is read from one place rather than kept
        # alongside a local copy, which is what a fourth copy with an import at
        # the top would look like; and that no label, no instruction and no
        # action table followed the machinery out — because if any had, the
        # digest in `tests/test_crisis_golden.py` would have become a pin on a
        # base class.
        # 37 selected, 31 required; the margin of 6 is unchanged.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap12_classifier_property -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-12 classifier property cases collected: $collected"
          if [ "$collected" -lt 31 ]; then
            echo "::error::the property gate collected $collected cases; the second opinion's structural rules are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap12_classifier_property

      - name: 'CAP-6: the open-loop ledger — the vocabulary, the timescale, the silence'
        # The ledger is the ranking function for everything Half does, and
        # every one of its rules is the kind that decays quietly: nothing
        # breaks the day a state is spelled two ways, a timescale acquires a
        # default, a movement date stops being validated, or silence starts
        # being stored instead of computed. The suite stays green and the
        # ranking is silently different. So this names it.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28 and CAP-12 steps are: it must not go green because another step
        # happened to run one of the same files.
        #
        # The count is asserted because `pytest -m cap6` against a renamed
        # marker deselects everything and exits 0, which looks identical to a
        # passing run. --strict-markers (pyproject) catches a misspelling; this
        # floor catches a rename.
        #
        # **A floor is the weakest of the three protections here, and review
        # proved it.** The first version was 92 collected against 80 required,
        # and deleting exactly the two AST guards the firewall rests on dropped
        # it to 90 — comfortably green, with the property unguarded. So the
        # firewall and the structural guards now carry their own markers and
        # their own gates below, *and* the cases each of those gates exists for
        # are named inside the suite itself
        # (`test_every_structural_guard_this_story_rests_on_still_exists`), so
        # deleting one fails by name rather than by arithmetic. 187 selected,
        # 160 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 cases collected: $collected"
          if [ "$collected" -lt 160 ]; then
            echo "::error::the CAP-6 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6

      - name: 'CAP-6: the refutation firewall — a wanting is never demoted or frozen'
        # A second gate over the subset that matters most, for the reason the
        # CAP-12 durability and handoff gates exist: a floor on the superset
        # cannot stop this half being hollowed out, and the half that would go
        # with it is the half where Half starts treating *"the main has done
        # nothing about the farmland for a year"* as evidence they never wanted
        # it.
        #
        # These are the cases for a retracted, revised and expunged support; a
        # correction that names the loop's own identifier; a tombstone that
        # shares it; a year of no evidence leaving the wanting standing; and —
        # added after review — that a loop left standing can **still move**.
        # That last one is not a refinement: one shared `expunged` set left a
        # loop present in the fold, passing every assertion above, while
        # silently dropping every later transition on it for ever. A wanting
        # that can never advance, be achieved, or change at all has been demoted
        # under another name.
        #
        # **Story 12 added four, and the floor moved from 9 to 15 with it** —
        # eleven that were already here plus one per correction shape reaching
        # the fold from the *inbound path*, which is a route that did not exist
        # before story 12. The cases above prove the firewall against a raw op;
        # these prove it against a main typing "that's wrong" into a message,
        # which is the only way a correction will ever actually arrive. Margin
        # is zero now where it was two, so removing any of the fifteen fails.
        #
        # **Story 9d added three, and the floor moves from 15 to 18 with them**
        # so the margin stays at zero. They are the firewall from the one side
        # story 9d could breach it from: a *minter* now creates tensions, and a
        # tension over the belief a wanting is made of is the ordinary case
        # rather than an exotic one. One asserts the loop's own record is
        # unchanged field by field after a mint — story 8's hole was a demotion
        # that travelled through `state.expunged` while the loop stayed in the
        # fold, which every presence check passed; one is its non-vacuity, that
        # the loop set is compared against at all, because a build that never
        # looked at a loop would leave every wanting standing too; and one is
        # structural, that the only name `half/consolidate` takes from
        # `half.loops` is the field a belief records its loop in.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_firewall -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 firewall cases collected: $collected"
          if [ "$collected" -lt 18 ]; then
            echo "::error::the firewall gate collected $collected cases; a loop may now be refutable"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_firewall

      - name: 'CAP-6: the firewall as a property of the package, not a spelling'
        # A third gate, over the structural guards, and it exists because the
        # first version of this story had none worth the name. It asserted that
        # two `fold` case bodies did not contain the substring "loops" — a
        # spelling — and three mutations walked past it with all 1836 tests
        # green: a demotion in the `Op.TENSION` branch (Half lowering a wanting
        # because contradicting evidence arrived, the exact CAP-6 violation),
        # the same demotion moved into a module-scope helper, and a new
        # `half/loops/decay.py` exporting `demote`.
        #
        # What these assert instead: that only the transition case and the
        # loop-named expunge block may *name* the loop table inside `fold`;
        # that nothing anywhere under `half/` mutates it outside those two
        # places, by any of the seven ways a dict can be changed; and that only
        # the ledger can compose a record carrying both a loop and a state, in
        # either of the two shapes such a record gets built. Each runs against
        # a synthetic bypass of its own, so none can pass having seen nothing.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap6_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-6 structural cases collected: $collected"
          if [ "$collected" -lt 12 ]; then
            echo "::error::the structural gate collected $collected cases; the firewall is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap6_structure

      - name: 'AD-9: a due-time queue, never a cron'
        # Nothing else in the product runs on a schedule, so every rule here is
        # one that decays in silence: nothing breaks the day the grace window
        # widens into a catch-up, the concurrency bound stops being applied, the
        # file lock is dropped because "one worker anyway", or jitter becomes a
        # `random` draw that loses the spread on every restart. The suite stays
        # green and a thousand mains quietly share an instant — or wake up to a
        # week of yesterday's thoughts at once.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12 and CAP-6 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review round 1 had to establish for the third story running. 109
        # selected, 95 required — and the twenty-nine guarantee cases are
        # marked separately and gated below, so deleting them lands on 80 and
        # fails *twice*: their own gate collects nothing, and this one drops
        # beneath its floor. The one-clock cases are inside this count too, for
        # the same reason.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 cases collected: $collected"
          if [ "$collected" -lt 95 ]; then
            echo "::error::the AD-9 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9

      - name: 'AD-9: the promises inside the queue'
        # A second gate over the subset that carries the story, for the reason
        # the CAP-12 durability and CAP-6 firewall gates exist. These are the
        # cases a mutation has actually been run against, each failing by name:
        #
        #   catch-up on a missed window, through `tick` *and* through
        #   `run_forever` (a startup `_catch_up()` was green across 2002 tests);
        #   `while True` replaced by one iteration; the loop's `except` replaced
        #   by `raise`; `ScheduleError` swallowed; an unbounded semaphore; the
        #   shipped bound, timeout and grace at absurd values; `flock` removed;
        #   `_is_contention` returning True; `note_pass` bypassing the per-main
        #   mutex; `_advance` swallowing a failed write and running the pass
        #   anyway; jitter added to a resolved 03:00 rather than placed inside
        #   the real window (eighteen zones at 05:57 local on the EET spring
        #   transition); `DERIVED_VERSION` reverted; the fold's fatal branch
        #   deleted; and `ticker.cancel()` inserted after `create_task` in
        #   `serve`.
        #
        # 29 selected, 25 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad9_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "AD-9 guarantee cases collected: $collected"
          if [ "$collected" -lt 25 ]; then
            echo "::error::the AD-9 guarantee gate collected $collected cases; the promises are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad9_guarantee

      - name: 'AD-30: one clock reader, and a zone that is told'
        # The structural half of story 9a: the scans, and the non-vacuity cases
        # that feed each scan every shape it must see. A behavioural test cannot
        # cover any of it — a scheduler reading the host zone agrees with every
        # other case in the suite on a machine set to UTC, and a second clock
        # reader breaks nothing until two subsystems disagree about what "today"
        # is, a year later.
        #
        # 40 selected, 30 required, with the eighteen guarantee cases gated
        # separately below: deleting them lands on 22 and fails both steps.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock-reader cases collected: $collected"
          if [ "$collected" -lt 30 ]; then
            echo "::error::the one-clock gate collected $collected cases; a second clock reader is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock

      - name: 'AD-30: the sentences the one-clock rule exists to make true'
        # The guarantee subset, because review round 1 found the first version
        # of the one-clock floor sized so that deleting exactly the three
        # guarantee cases landed on it and passed — leaving eight non-vacuity
        # cases exercising a helper nothing called on the package. Third story
        # running for that shape of bug, so the split is now the default.
        #
        # These are: exactly one module in the tree reads a clock, in any
        # spelling — an alias bound to the function, a `default_factory`, a
        # `getattr`, a rebound module, a `from` import (each of which walked
        # past the first scan); no module anywhere can infer where the main
        # sleeps from a prefix, an IP or a locale (a rule whose matrix row said
        # *asserted structurally* while nothing asserted it); nothing reads the
        # host's own zone through a bare `astimezone()` or a naive
        # `fromtimestamp`; the due time is identical whatever `TZ` the process
        # was started with, checked in subprocesses; an untrusted stamp — NaN,
        # infinity, negative, absurd, or not a number at all — is clamped into
        # the range `half.civil` will read back, and never escapes as an
        # exception; and everything the tick calls takes an injected `now`.
        #
        # 18 selected, 16 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m one_clock_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "one-clock guarantee cases collected: $collected"
          if [ "$collected" -lt 16 ]; then
            echo "::error::the one-clock guarantee gate collected $collected cases; the rule is a spelling again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m one_clock_guarantee

      - name: 'CAP-7: the tension ledger — the vocabulary, the drift, the pass'
        # *Drift is tension velocity* is one of the three metrics the product
        # is measured on, and every rule that makes it trustworthy is the kind
        # that decays in silence: nothing breaks the day a state is spelled two
        # ways, a threshold starts deciding widening, a model gets asked
        # instead of the log, a transition replaces the mint instead of merging
        # over it, or the nightly pass stops being idempotent. The suite stays
        # green and a main is told their life is drifting on a number two
        # builds would disagree about.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12, CAP-6, AD-9 and AD-19 steps are: it must not go green
        # because another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review has had to establish for five stories running. 411
        # selected, 370 required — and the 209 guarantee cases are marked
        # separately and gated below, so deleting them lands on 202 and fails
        # *four* times: all three subset gates collect nothing, and this one
        # drops 168 beneath its floor. The margin, 41, is deliberately far
        # smaller than the guarantee count, so the slack cannot be absorbed by
        # deleting guarantees — which is what review round 2 measured happening
        # on the AD-19 gate.
        #
        # **Story 9d added 84 and the floor moves with them, from 286 to 370,
        # so the margin does not grow.** They are the minting half: the
        # comparison bound, the cheap filter, the budget, idempotence and the
        # judgement seam. Sixty-two of the eighty-four carry `cap7_minting` as
        # well and are gated below at margin zero, which is what actually
        # protects them — this floor's margin of 41 could not protect any 41
        # named cases and never claimed to.
        #
        # **Story 9d's review adds 39 more and the floor moves again, from 370
        # to 409, so the margin stays 41.** 450 selected. They are the couple
        # ceiling on the shape production actually writes, the minting
        # arithmetic leaving the event loop, the watermark that now means *"the
        # pass ran"* rather than *"the scheduler passed through"*, the ordered
        # restatement filter, the budget's three corrected reports, and the
        # mint door's stray-field guard. Thirty-one of the thirty-nine carry
        # `cap7_minting` and are gated below at margin zero, which is again
        # what actually protects them.
        #
        # **Story 9e adds 96 and the floor moves again, from 409 to 505, so the
        # margin stays 41.** 546 selected. They are the judgement itself: the
        # gap that is never the truth and the contradiction that answers no,
        # the third value that cannot collapse into the second, the bound
        # asserted against the tick's own timeout, two claims in five scripts
        # and in two different ones, and the claim that reaches a provider and
        # no other place at all. **All ninety-six carry `cap7_judgement` and are
        # gated below at margin zero**, which is what actually protects them —
        # this floor's margin of 41 could not protect any 41 named cases and
        # has never claimed to.
        #
        # **Review round 1 of this story found that a floor is not enough on
        # its own, twice over.** A tension frozen on its first transition — two
        # separate one-line mutations in ``widening.drift`` — passed all 2950
        # cases, because every case that drove a state change started from a
        # `fresh` tension. And the Ask-First threshold this story forbids could
        # be inserted into ``ledger.plan``, one layer above the guard that
        # forbids it, with the same result. Both are now named cases inside the
        # suite (``test_every_movement_case_this_story_rests_on_still_exists``),
        # so deleting one fails by name rather than by arithmetic.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 cases collected: $collected"
          if [ "$collected" -lt 505 ]; then
            echo "::error::the CAP-7 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7

      - name: 'CAP-7: a correction resolves a tension and never deletes one'
        # A second gate over the subset that carries the story's most invertible
        # rule, for the reason the CAP-6 firewall gate exists — and this is that
        # firewall's deliberate **inverse**. A loop is a wanting, which evidence
        # cannot refute, so the correction path is structurally unable to reach
        # it; a tension is a claim about *two entries*, so retracting one of
        # them genuinely ends the disagreement and the correction path must
        # reach it. Each rule applied to the other's object is a
        # plausible-looking line, which is why both are written down and both
        # are gated.
        #
        # And the inverse of story 8's own hole is gated with them. That
        # firewall passed its AST check while a demotion travelled through
        # `state.expunged` instead of `state.loops` — a loop present in the
        # fold, which every case asserted, and silently unable to move again.
        # The equivalent here is a correction that resolves a tension *and also*
        # drops it, which is indistinguishable from correct behaviour to any
        # case that only reads the state afterwards. So every case below
        # asserts the tension is present **by id** after retract, revise and
        # expunge, keeps its pair and its license, is absent from the expunged
        # set, and comes back from a rebuild.
        #
        # **And `resolved` is terminal by every route, which review round 1
        # found it was not.** A correction resolved a tension, a later
        # ``tension`` append carrying any live state merged straight over it,
        # and the tension came back live from a rebuild — while
        # ``half/tensions/states.py`` said in prose that there is no path from
        # `resolved` back to any other state. The expunge path had a guard and a
        # case; this one had neither. A tension *minted over a side that was
        # already gone* was the same hole from the other end: the fold only
        # resolved while folding the correction, so a mint that arrived
        # afterwards folded live and the pass computed drift across an entry
        # that does not exist.
        #
        # 29 selected, 24 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_resolution -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 resolution cases collected: $collected"
          if [ "$collected" -lt 24 ]; then
            echo "::error::the resolution gate collected $collected cases; a correction may now delete a tension"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_resolution

      - name: 'CAP-7: neither side of a tension is wrong'
        # A third gate, over the guards that have to fail when a ranking is
        # **added** rather than merely pass because none exists. That
        # distinction is the whole lesson of story 6c's no-authoring rule,
        # which forbade three spellings of *writing* a field and let the
        # content be composed elsewhere and handed to the blessed writer.
        #
        # So there are four layers, each with its own synthetic bypass: the
        # append gate refuses a ranked field outright, on every spelling and
        # through all three ways a record is built; the drift computation is
        # asserted symmetric under swapping the pair, over the whole matrix of
        # states and accumulation patterns; no expression in the tension
        # surface may index the pair positionally or sort, max or min over it;
        # and no name, argument, attribute, keyword or dict key in that surface
        # may come from the vocabulary of ranking. Twenty mutations were run
        # against them before this gate was written — a winner field on the
        # ledger, on the pass and in the fold's resolution; a computation that
        # prefers the first side; a comparator that orders the pair and changes
        # no output; a whole new `half/tensions/rank.py`; and the side composed
        # under an innocent name and handed to the blessed writer. Every one is
        # red.
        #
        # Salience is gated here too, and deliberately: this story builds no
        # decay, because story 4 made salience computed with a ninety-day
        # half-life. The way that regresses is a counter stored on a tension
        # for the pass to mutate — the exact AD-30 violation story 4 avoided,
        # arriving one object over — so the pass's whole append vocabulary is
        # pinned to one field and the half-life is pinned by value.
        #
        # **Review round 1 found three holes in this gate and they are all
        # closed here.** The ranked-field check matched *exact strings*, so
        # ``winner`` failed and ``winner_id``, ``winning_side``, ``is_winner``,
        # ``side_that_won``, ``more_credible``, ``truer_side``, ``moved_side``
        # and ``which_moved`` were every one of them accepted and durable —
        # including ``moved_side``, which is the line ``widening.py`` itself
        # names as the likely breach. The same exact-string rule was the module
        # scan, so ``def stronger_side(tension)`` in the tension package left
        # the whole suite green: the guard covered what a record carries and not
        # what a module offers, and it needed both. And every scan read
        # ``half/tensions`` and ``half/consolidate`` only, while this story
        # wrote tension code into the fold, the append gate and the registry —
        # ``held["winner"] = pair[0]`` injected into the fold's merge branch
        # passed all 2950 cases. That is story 8's hole exactly: the guard
        # passed because the violation travelled through a module it did not
        # cover.
        #
        # **This gate's whole margin used to be absorbable by shrinking the set
        # it guards.** The largest case expands over ``RANKED_FIELDS`` one for
        # one, and nothing pinned it: deleting twelve entries landed the gate on
        # exactly its floor, green, with ``loser=`` and ``ranked=`` appending
        # cleanly. The set is pinned by value now, the way the persistence
        # window is.
        #
        # **Story 9d's review adds six and the floor moves with them, from 100
        # to 106, so the margin stays 18.** ``Couple`` travels as ``both`` and
        # offers ``names``, and neither was in the positional scan's
        # vocabulary — so replacing ``relevance.weight``'s body with
        # ``return surprisal(couple.both[0], ...)``, which reads the pair
        # positionally and ranks one side over the other in the function the
        # budget's ordering runs through, left the whole suite green. Probing
        # the widened guard then found a third spelling: ``fields["between"]``,
        # which is how every door in the registry and the append gate reaches
        # the pair, and which the scan knew as a *name* and never as a *key*.
        # Both are bypass rows now, and a behavioural case asserts the weight
        # and the priority order are unchanged when the ledger is built the
        # other way round — the AST scan catches the spelling, and only the
        # arithmetic catches the arithmetic.
        #
        # 124 selected, 106 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_neutrality -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 neutrality cases collected: $collected"
          if [ "$collected" -lt 106 ]; then
            echo "::error::the neutrality gate collected $collected cases; a tension may now rank its two sides"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_neutrality

      - name: 'CAP-7: minting is bounded — never all-pairs, inside a fixed budget'
        # A fourth CAP-7 gate, over the story that finally *creates* the
        # capability's central object — and over the one rule in it that is a
        # correctness rule rather than a judgement call. CAP-7's success
        # criterion is not that tensions get minted; it is that the pass *"runs
        # within a fixed per-user cost budget because comparison is bounded to
        # new or changed entries against the loop set and against beliefs
        # sharing a subject, gated by a cheap relevance filter before any model
        # comparison — never all-pairs"*. Every clause of that is a way to spend
        # a main's money quietly, and none of them breaks visibly: a minter that
        # compared all-pairs would produce *better* tensions and a bill that
        # scales with the square of a ledger nobody watches.
        #
        # **Never all-pairs cannot be gated by a count, and this is the gate
        # where that lesson is spent.** A fixture with ten beliefs and two
        # changed passes whether the code compares 2xN or N-squared, so a case
        # asserting *"only four comparisons"* asserts nothing about the rule.
        # Story 11's review found this shape's mirror one capability over — a
        # sweep asserting `<= 1` that passed at zero. So the rule is asserted as
        # a **derivative**: the ledger is grown by a factor of twenty with
        # entries that neither sit on a loop nor share a subject, the candidate
        # set and both comparison sets are held fixed, and the comparison count
        # and the judgement count must not move *and must not be zero*. Both
        # halves are in every growth case, at both layers — the comparisons in
        # `tests/test_candidates.py` and the judgements bought in
        # `tests/test_minting.py` — with a non-vacuity case pinning what
        # all-pairs would have produced at the largest size (33 411 and 861).
        #
        # **Where the rule is "the judge is never reached", the double counts
        # its calls.** `mint.consider` catches per couple by design, so a double
        # that only raised would turn an `AssertionError` into a legal outcome
        # and a case asserting *"nothing was minted"* would pass whether or not
        # the port had been paid for. That is `conftest.NeverGenerates`'s own
        # finding, arriving one port over, and every zero-call case here asserts
        # a counter.
        #
        # **And the four ways nothing is minted are four cases naming four
        # different fields**: the judge said no, the judge could not say, the
        # judge raised, and no judge is wired — which is what this build ships.
        # Folded together they would be one assertion that is satisfied by the
        # port never being reached at all.
        #
        # Sixteen mutations were run against these before this gate was
        # written, each with a purged bytecode cache, a green baseline asserted
        # either side of it, and the anchor asserted unique — a filter that
        # admits everything; the filter moved behind the judge; the budget not
        # applied; the budget applied but never reported; a standing tension not
        # recognised; an erased tension minted again; a mint born `persistent`;
        # a raised judgement minted anyway; the priority reversed; the pass
        # re-evaluating before it mints; the mint door admitting a second record
        # for a tension the log holds; the mint view carrying the whole belief
        # record; all-pairs; the loop set dropped; the subject set dropped; and
        # the watermark ignored. Every one is red.
        #
        # **Story 9d's review added thirty-one, and every one of them owes this
        # number an edit.** 93 selected, 93 required. The eleven mutations run
        # against them, each with a purged bytecode cache and a green baseline
        # asserted on both sides: the positional read of the couple in
        # ``weight``; the pair sorted inside ``note_mint``; ``sorted(fields
        # ["between"])`` in the same place, which the widened guard was itself
        # probed to find; a tension function added to an outpost unregistered;
        # the couple ceiling disabled; the minting arithmetic put back on the
        # event loop; the ``corpus`` short-circuit removed; the judgement
        # billed after the ``except`` rather than before; the no-judge check
        # pushed back inside the loop; the old *"left for the next pass"* log
        # line; ``note_mint``'s stray-field guard dropped; ``KEY_DIGITS``
        # narrowed back to twelve; and ``on_a_loop`` and the membership tests
        # unguarded. Every one is red. Review's own ``fields_for(couple)``
        # mutation, which used to leave three cases green, now reddens
        # fourteen.
        #
        # **The margin is deliberately zero: 93 selected, 93 required.** Every
        # case in this gate is the only one asserting its rule, which is the
        # condition under which a zero margin is right — and it is why the CAP-7
        # floor above was not inflated instead. It also means every case added
        # here owes an edit to this number, which is the cost of a zero margin
        # and is why `cap7_minting` is applied **per case** rather than as a
        # module-wide `pytestmark`: `tests/test_turn_words.py` shows the other
        # shape, where every case added to a file silently owes a workflow edit
        # nobody remembers.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_minting -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 minting cases collected: $collected"
          if [ "$collected" -lt 93 ]; then
            echo "::error::the minting gate collected $collected cases; the comparison bound or its budget has stopped being asserted"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_minting

      - name: 'CAP-7: the judgement — the gap and never the truth'
        # The third subset gate over CAP-7, and it exists because the rule it
        # protects is the one this story could get wrong while looking as
        # though it worked.
        #
        # A tension is two entries that **disagree where neither is wrong**.
        # *Disagree* is the word a model reads as *contradict*, because that is
        # what it means nearly everywhere else — and a judge that minted
        # contradictions would mint steadily, plausibly, and would be building
        # a worse story 12 (the main said something false; Half asks and
        # removes a belief) under CAP-7's name. Nothing about the shape of the
        # log, the counts or the pass would look wrong. So the distinction has
        # a gate.
        #
        # The rest of what it protects, each rule with no second case:
        #
        #   that the **third value cannot collapse** — `True` mints, `False` is
        #   no, `None` is cannot say, and unsure, degraded and declining all
        #   answer `None`. Every one of them mints nothing, so *"nothing was
        #   minted"* is satisfied by a judge that answered correctly and by a
        #   judge that was never reached, which is the assertion-identical-
        #   either-way shape this project has shipped and taken back twice. The
        #   counts are where the difference survives and each has a case that
        #   fails for its own reason;
        #   that the **bound fits the pass** — `JUDGEMENTS` judgements at this
        #   story's bound against `half/schedule/tick.py`'s per-main timeout,
        #   asserted as a relation between the constants and refused at import,
        #   with three bypass rows including the morning composer's bound, which
        #   is the number somebody copying the nearest consultation reaches for.
        #   Story 13a wrote exactly this kind of cross-constant claim into a
        #   comment and pinned it nowhere;
        #   that the judgement is **worldwide** — five scripts, a pair whose two
        #   halves are in two different ones, and the rendered request compared
        #   between them so that *no English rubric and no locale on the path*
        #   is a measurement rather than a sentence;
        #   that **two claims leave the machine and nothing else does** (AD-22)
        #   — hunted with a sentinel through the payload, the log file, the
        #   folded table, the tally, the result and every captured line, and
        #   scanned over the arguments of every logging call in the module;
        #   and that a judgement **never costs the pass** — absent, standing
        #   down, slow, refusing, over budget, unreadable or raising, asserted
        #   at the boundary CAP-7 makes the promise at: a real `Scheduler.tick`
        #   reporting the main under `ran` rather than under `failed`.
        #
        # **The margin is deliberately zero: 96 selected, 96 required.** Every
        # case in this gate is the only one asserting its rule, which is the
        # condition under which a zero margin is right — and it is why the
        # CAP-7 floor above was not inflated instead. It also means every case
        # added here owes an edit to this number, which is the cost of a zero
        # margin and is why `cap7_judgement` is applied **per case** rather
        # than as a module-wide `pytestmark`: `tests/test_turn_words.py` shows
        # the other shape, where every case added to a file silently owes a
        # workflow edit nobody remembers.
        #
        # **Thirteen mutations were run against these before this gate was
        # written**, each with a purged bytecode cache on both sides, a green
        # baseline asserted either side of it, every anchor asserted unique, and
        # the failing case *names* recorded rather than an exit code. Every one
        # is red. In order, with what caught it:
        #
        #   the contradiction label mapped to `True` — **caught at import**: the
        #   module refuses itself, so the whole suite fails to collect;
        #   `cannot_say` mapped to `False` — **caught at import**, same way;
        #   the contradiction label deleted from the set entirely — four cases;
        #   an answered `cannot_say` arming the breaker — one;
        #   an unknown label coerced with `.get(label, False)` instead of a
        #   membership test — one;
        #   the bound raised to the morning composer's twenty seconds — three;
        #   the cross-constant check replaced by `if False` — one;
        #   `SHARE_OF_TICK` widened to the whole slot — three;
        #   the breaker's skip counted as a consultation — one;
        #   the separator dropped so the two claims ran together — one;
        #   `claims_of` lower-casing both claims — four;
        #   the exception logged with its own text instead of its class — two;
        #   and the bench bypassed in `half/consolidate/pass_.py`, so no judge is
        #   ever resolved for anybody — nine.
        #
        # None is red only in one place by accident, and none in the first two
        # rounds is red anywhere outside this file — which is the second half of
        # what a subset gate has to be true for.
        #
        # **The two import-time refusals are the interesting rows**, and they
        # are the reason this gate has three cases it would not otherwise have.
        # A module that refuses itself is red everywhere at once and therefore
        # *names* nothing: a reviewer reading that build learns the tree is
        # broken, not that a contradiction was about to be minted. So each of
        # those guards also has a bypass case that mutates the mapping under
        # `monkeypatch` and asks the module to accept itself
        # (`..._refuses_the_module`), which is red **by name** inside an
        # otherwise green tree. The `cannot_say` one was missing until the
        # mutation run said so.
        #
        # **A second round of five mutations, run after those cases were added,
        # found a guard that could not fire.** `_check_constants` carried the
        # mirror of the two classification modules' *no label asks, so this
        # widens nothing* check — *no label says no* — and deleting it left the
        # whole suite green, because the two rules above it already require the
        # contradiction label to be present and to answer `False`. It is gone,
        # and what replaced it is the reachable half: a label set with **no home
        # for a contradiction** is refused by name rather than by the `KeyError`
        # the line beneath it used to raise. The other four in that round —
        # a failing judgement made to cost the pass (one case), the cannot-say
        # guard deleted (one), the tally counting by verdict instead of by label
        # (eight), and the holder allowlist turned back into a denylist (two) —
        # are all red.
        #
        # **A third round of four, run when the tier was pinned.** SPEC's
        # constraint — *the nightly pass runs on a cheaper tier than
        # conversation, since the free tier depends on that gap* — is what
        # decides `CLASSIFY_TIER`, so the two mutations that matter are the
        # wiring following the main's tier again and the pinned tier becoming
        # the frontier one; both are red on the case that asserts it from both
        # sides of the provider. A third — the tier name respelled as a literal
        # in the composition root instead of read from this module — was
        # **green** on the first attempt, because a case can assert that a
        # constant is *bound* without asserting that it is *used*; the case now
        # reads the `Tiers.parse` call out of `half/__main__.py` by AST, and it
        # is red. The fourth, a main equipped without a credential, is red here
        # and in `tests/test_minting.py`, which is correct: whether a key equips
        # a main is a claim both files make.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap7_judgement -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-7 judgement cases collected: $collected"
          if [ "$collected" -lt 96 ]; then
            echo "::error::the judgement gate collected $collected cases; the gap, the third value or the bound has stopped being asserted"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap7_judgement

      - name: 'CAP-11: a correction removes the belief, and never on inference alone'
        # The gate for the capability that lets a main disagree with Half. The
        # ops have been in the closed vocabulary since story 1 and the fold has
        # removed a belief for any of them since story 1 — and **nothing on the
        # inbound path appended one**, so every rule below was uncovered until
        # story 12 and would go quiet the same way if it were removed.
        #
        # Marker-selected rather than file-selected, for the reason every other
        # gate here is: it must not go green because another step happened to
        # run one of the same files. The cases live in tests/test_correction.py,
        # tests/test_attribution.py and tests/test_replay.py.
        #
        # What it covers, and each of these is a rule with no second case:
        #
        #   that an explicit correction **appends and removes** — revise with
        #   the system-was-wrong stamp, retract with the world-changed one, and
        #   the third state with neither, asserted as two absences so that a
        #   build defaulting in either direction fails and one recording both
        #   fails twice;
        #   that the attribution is read off the **stamps and never the op**,
        #   swept over every correction op crossed with every stamp
        #   combination — the crossing is the boundary, and without it a fixture
        #   where the two always agree would pass on an implementation reading
        #   either;
        #   that a record may not carry both stamps, a stamp on an op that
        #   contradicts it, a stamp on an erasure, or a stamp nothing can parse
        #   — each refused before it is durable, because the log is append-only;
        #   and that a correction with **no** stamp is perfectly valid, which is
        #   the case an over-strict gate would break;
        #   that a message only the classifier reads as a correction produces a
        #   **candidate and no append**, asserted three ways: the function that
        #   builds removals raises on one, the widening module can name no op
        #   and no way to append, and a turn end to end leaves the log empty of
        #   corrections;
        #   that nine ways of not getting a label — four failures, a raise,
        #   nothing, prose, an unknown label, and a holder past its bound —
        #   each leave the table's answer standing and invent no correction;
        #   that a widening with no holder, and a runtime with none at all,
        #   still recognise and act on every explicit correction, because the
        #   table is offline and the model only widens;
        #   that the wanting stands when its only support is corrected, over all
        #   four correction shapes, through the route this story adds;
        #   that a correction inside the crisis mode is not processed;
        #   that a correction turn spends **no favour and attaches no bought
        #   question** — with a companion case proving the same fixture still
        #   buys one on an ordinary turn, so the rule is not passing because
        #   nobody is ever asked anything;
        #   that what Half shows is the claim **as recorded**, byte for byte,
        #   against a claim carrying punctuation and a second script — and that
        #   a claim carrying a line break cannot forge a second marker line,
        #   which matters because claims are attacker-influenced;
        #   that a removal happens in **ten scripts with the op asserted per
        #   row**, so a build mapping every non-English correction to `expunge`
        #   fails rather than passes;
        #   that a correction phrase is matched **inside** an unspaced run,
        #   which is why there are two matchers, and which a mutation found
        #   untested: every script case happened to be a message that *was*
        #   exactly the phrase, so swapping the cutter for the weaker one left
        #   all of them green;
        #   that the table fires on **no ordinary message in any script it
        #   carries** — including the four sentences containment used to break
        #   on — with a coverage case that fails when a row is added in a script
        #   the negatives do not reach, so the sweep cannot be narrowed quietly;
        #   that a declined candidate cannot catch a later yes, and that a
        #   candidate does not survive a turn the crisis gate answered itself —
        #   both mutation findings, and the second is the worst of them: a
        #   crisis reply that ends *"tell me, I am here for that too"* invites
        #   exactly the bare yes that would have deleted a belief;
        #   that a `behave` claim reaches the wire on a **removal** turn and on
        #   no other — including a turn the classifier read as a correction,
        #   which the first version of this bound structurally could not see
        #   because it ran its negative with no classifier at all;
        #   that nothing at all is recorded on a crisis turn, asserted on what
        #   the log *gains* rather than on what it fails to remove: the
        #   no-correction assertion alone survived a gate that called the turn
        #   path anyway, because crisis also disables retrieval;
        #   that the fail-open handler is run against the fault it exists for,
        #   and that the breaker stops calling a failing provider, per main —
        #   **interleaved and one short of the trip**, because a shared counter
        #   is invisible once the first main has tripped and reset — and is
        #   cleared by one good answer;
        #   that a correction about nothing the conversation touched removes
        #   nothing, that a correction with no antecedent removes nothing (the
        #   floor's own boundary), and that the aim skips the message that
        #   carried it;
        #   that an erasure cannot be planned without an answer **however it was
        #   recognised**, which is a different refusal from the inference one
        #   and is not reachable through it;
        #   that a cause may not be written on an op that removes nothing;
        #   that the table registry cannot desync, run against both mutations;
        #   that a declined candidate does not swallow the turn, that a removal
        #   is shown even when the turn has no reply of its own, and that two
        #   corrections inside one second are two records;
        #   that what was proposed and what was confirmed are counted, that a
        #   confirmation of a belief already gone is **not** counted as a
        #   deletion, and that the counts reach an operator through `serve`;
        #   and that all three attributions read the same after the derived view
        #   is deleted and replayed (AD-4).
        #
        # **Margin zero: 265 selected, 265 required.** Story 14 adds four, all
        # reaching this gate through the file's own `pytestmark`: the
        # non-vacuity case for the model-surface rule, which became a property
        # check instead of a name check; the hundredth wholly failing
        # consultation alarming at `error` rather than reporting at `info`,
        # which is the payoff of extracting the shape and is the branch story
        # 13a fixed in one module of three; and the two structural cases naming
        # which numbers are the shape's and which are this main's, and that the
        # shape is read here rather than kept alongside a local copy.
        # Sized against the subset
        # it protects rather than against a total, and every case here is the
        # only one asserting its rule.
        #
        # Story 13b added three, and the floor moves with them so the margin
        # stays zero: that the inclusion check CAP-11 now runs over a composed
        # reply is defined over the fallback it falls back to — so the check can
        # never refuse everything the turn is able to send — that a removal with
        # no readable claim shows nothing and refuses nothing, and that a
        # *proposal* holds no claim at all while the removal the main's answer
        # produces does. The floor said 257 while 260 were collected for one
        # commit of that story's review, which is how a zero-margin gate quietly
        # stops being one.
        #
        # Three blocks of it are sweeps rather than single cases — twelve
        # op-by-stamp crossings, ten scripts twice over, and forty-odd ordinary
        # messages that must fire on nothing — and that is fine *here* in a way
        # it was not in the AD-18 and AD-28 gates, because this gate is about
        # recognising corrections: a floor dominated by corrections and
        # non-corrections in many scripts reports exactly what it protects. The
        # negative sweep is the largest block and is the one that grew after
        # review, which is the right shape for a table that acts with no
        # confirmation.
        #
        # **The number is file-coupled** for tests/test_correction.py and
        # tests/test_attribution.py, which carry the marker at module scope
        # because every case in them is a story-12 rule; tests/test_replay.py
        # marks the one case. Adding a case to any of them is therefore a
        # deliberate edit to this number, which is what a zero margin means.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap11 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-11 correction cases collected: $collected"
          if [ "$collected" -lt 265 ]; then
            echo "::error::the CAP-11 gate collected $collected cases; a main may not be able to tell Half it is wrong"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap11

      - name: 'CAP-11: the structural rules correction rests on'
        # A second gate over a **subset** of the one above, for the reason
        # ``cap4_structure``, ``cap6_structure`` and ``cap8_structure`` exist: a
        # floor on the superset cannot protect a handful of single cases inside
        # it, and every case here is the only one asserting its rule.
        #
        # What it covers, and none of it is behavioural:
        #
        #   that ``apply.plan`` raises on an inferred correction the main has
        #   not answered, for **every** meaning, so a new inference route cannot
        #   pick the one that was left open;
        #   that the widening module can name no op, no store and no way to
        #   append — an AST scan, because *"it does not append today"* decays
        #   the first time somebody reaches for one and the reach is invisible;
        #   that no label may do more than ask, that the enum has exactly two
        #   members, and that a fallback which asks is unrepresentable;
        #   that a holder which is not a classifier, is callable, or can also
        #   generate is refused — an allowlist, because the denylist this
        #   pattern replaced let ``classify`` plus ``chat`` walk through;
        #   that the widening is sealed, so a wider holder cannot be assigned
        #   after the check;
        #   that only the message leaves the machine — no claim, no belief id,
        #   no main_id in the payload;
        #   that every string constant in the module that builds what Half says
        #   is punctuation, a field name or an enum value, so the op's own name
        #   is the whole vocabulary and nothing is composed;
        #   that the proposal and the removal are **one rendering read two
        #   ways**, sharing a head byte for byte and differing only in the
        #   claim — which is the AD-18 bound expressed in the renderer;
        #   that the package reaches no channel, no ``half.crisis`` — the
        #   spine's layer rule, and the reason there are two tokenizers in the
        #   tree — and no clock;
        #   that exactly one module in it may name a model, may name only the
        #   port, and that the rest of ``UNREACHABLE`` still stands over the
        #   whole package;
        #   that ``attribution_of`` names no op inside its own body, with a
        #   bypass case run against the mutation it forbids — the plausible one,
        #   falling back to the op when no stamp is there;
        #   that graphiti's other two timestamps are fields of no record;
        #   that the bound and both caps are the ones story 6d settled;
        #   that an **erasure** cannot be planned without the main's answer
        #   however it was recognised — a different refusal from the inference
        #   one, and unreachable through it, because an erasure destroys the
        #   body and no correction of the correction can bring it back;
        #   that the table registry cannot desync, run against both mutations —
        #   a table defined and never consulted, and one renamed in a single
        #   place, which raises on the turn path;
        #   that the widening reaches the shipped product **and** that ``serve``
        #   hands the runtime the one ``build`` made, both asserted by value off
        #   the composition root, because story 6d's identical claim once passed
        #   with the value set to ``None``;
        #   and that ``LIFTED`` — the exemption table this package's model lift
        #   lives in — holds that one entry and no other. Adding a line to it
        #   plus a model import in ``half/questions`` left the whole suite
        #   green, which made the rule story 11 fixed undoable by a one-line
        #   edit in a test helper.
        #
        # 28 selected, 28 required. Zero margin: every case is a rule.
        #
        # **Story 14 adds one**, and it is the price of a rule that changed.
        # The widening's model surface was checked by a name — every reached
        # target had to start with `half.model.port` — which a future
        # `half/model/port_provider.py` would have satisfied by spelling alone,
        # and which refused `half/model/consult.py` although it reaches only
        # the port. The check is now the property that name stood for: every
        # `half.model` module reached must itself reach nothing under
        # `half.model` but the port. The added case is its bypass, run against
        # a synthetic tree containing the reach it forbids.
        #
        # **And three more**, each asserting something no amount of behaviour
        # can show: which numbers are the shape's and which are this main's,
        # with the three policy numbers absent from the shape entirely; that
        # the shape is read from one place rather than repeated here, run
        # against the mutation it forbids; and that no label and no instruction
        # followed the machinery out — scanned over identifiers and literals
        # rather than prose, because this module's own label is the ordinary
        # word `correction` and the shape's docstring uses it to name this very
        # file while explaining what it must not know.
        #
        # Story 13b added the two that keep its inclusion check honest, and the
        # floor moves with them. ``shows`` is defined over ``shown``'s own
        # output, so the fallback satisfies it by construction — a check and a
        # fallback that could disagree is a check that silences a main every
        # time it fires — and that is swept over claims a second normalization
        # would damage: a line break, a control character, leading space, a
        # Devanagari matra, a Khmer dependent vowel. The second says what
        # happens when there is no claim to show at all.
        #
        # *"The package opens no store of its own"* is deliberately **not** here.
        # It is asserted in tests/test_unasked.py, where one predicate sweeps
        # every package the rule covers, and it is counted by the CAP-4
        # structural gate that has always owned it. A copy here would be a
        # weaker copy: story 11 shipped exactly such a copy and both of story
        # 5b's known bypasses walked past it.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap11_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-11 structural cases collected: $collected"
          if [ "$collected" -lt 28 ]; then
            echo "::error::the CAP-11 structure gate collected $collected cases; a rule with one case has lost it"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap11_structure

      - name: 'CAP-8: the morning surface — one a day, traceable, or silence'
        # Nothing else in the product speaks first, so every rule here is one
        # that decays in silence: nothing breaks the day the one-a-day rule
        # becomes twenty-four hours instead of the main's own civil day, the
        # traceability check learns to accept a candidate that cites nothing,
        # the surface starts reaching into the ledger when a pass found
        # nothing, or *sending* quietly becomes the only success case.
        #
        # Marker-selected rather than file-selected, for the reason the AD-9,
        # CAP-6, CAP-7 and CAP-12 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor is sized against the subsets, not against the total**,
        # which is the correction review round 2 forced. The old numbers looked
        # careful and protected nothing: deleting the whole AST separation wall
        # (6 cases) or the three structural ceiling cases left both this gate
        # and the sub-gate green, and the 24 cases this gate alone guards — the
        # wiring and the determinism guarantees among them — fitted inside its
        # own margin.
        #
        # 513 selected, 479 required. Story 14 adds four, all reaching this
        # gate through `tests/test_voice.py`'s own `pytestmark`: the
        # model-surface rule's non-vacuity case, and the three below. The floor
        # moves with them, so this story does not grow the margin.
        #
        # **The margin here is 34 and the paragraph below says it is 10.** That
        # is not story 14's doing and it is not being fixed here: the count was
        # 509 before this story's single case, against a floor of 475 that has
        # not moved since it was written for 485. Somewhere between then and now
        # twenty-four cases were added without the floor following them, which
        # is the exact failure the sentence *"the floor moves with them, so the
        # margin does not grow"* was written to prevent, and it is recorded
        # rather than quietly corrected because tightening another story's gate
        # by 24 inside a refactor is how a refactor stops being reviewable.
        #
        # The margin was meant to be 10, and deliberately smaller than every
        # protected subset: silence (82), nagging (72), structure (13), the wire
        # text (300) and the cases held by this gate alone. Deleting any one of
        # them drops this gate beneath its floor **and** fails whichever
        # sub-gate names it. Story 11 added one and story 13a added 300.
        #
        # The silence figure read 83 for one revision and the gate collects 82.
        # A number in a comment that the gate does not support is the same defect
        # as a floor that protects nothing, one layer up: it is what a later
        # reader sizes the next floor against.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 cases collected: $collected"
          if [ "$collected" -lt 479 ]; then
            echo "::error::the CAP-8 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8

      - name: 'CAP-8: silence is the ordinary outcome, and the ceiling holds it'
        # A second gate over the half that carries the story, for the reason the
        # CAP-12 durability, CAP-6 firewall and CAP-7 resolution gates exist.
        #
        # What it covers: that a quiet night sends nothing and logs no warning;
        # that a pass which moved nothing produces no candidate at all, so most
        # days are silent by construction; that a candidate which cannot cite
        # the preceding pass — or whose origin the main erased overnight — is
        # not surfaced; that crisis, an already-spent day, an unreachable
        # platform, a `behave` ceiling and the nagging bound each silence a
        # morning **alone**, and every pair of them in both orders; that a main
        # capped at `behave` receives nothing at every rung, swept over
        # ``ladder.RUNGS``; and that a day which could not be claimed stops the
        # send.
        #
        # **And the four one-a-day orderings review reproduced**, each of which
        # sent a second message on a day one had already gone out: a marker
        # stamped ahead of now; a main who moves west overnight and has
        # yesterday's marker recomputed under today's zone; two overlapping
        # runs that both read an unspent day; and a derived view left behind
        # the log by a crash between the append and the rebuild.
        #
        # It also carries the alert and the counter that review found missing
        # from the unreadable-marker path, and the per-loop half of the same
        # finding.
        #
        # Story 11 added two, and they are a change to *what a morning may do*
        # rather than two more reasons for silence: **the morning surface is not
        # an asker.** One is an import rule over the whole package — nothing under
        # half/surface may resolve an import into half.questions or half.trust —
        # and one is a full morning, with an affordable question in the log and
        # its topic freshly raised, that writes no `asked` record. 82 selected,
        # 74 required — the floor moves with the count so the margin stays at
        # eight.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_silence -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 silence cases collected: $collected"
          if [ "$collected" -lt 74 ]; then
            echo "::error::the CAP-8 silence gate collected $collected cases; silence is now unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_silence

      - name: 'CAP-10: a loop is never touched faster than its own timescale'
        # The nagging bound, gated beside the surface rather than inside it,
        # because it is the rule that decays most quietly: a bound that stopped
        # bounding would show up as a Half that is slightly more talkative, and
        # nothing else, for months.
        #
        # What it covers: that the bound is derived from each loop's *own*
        # period, swept over all four timescales against one interval so a
        # single shared cooldown — the reference implementation's shape — fails
        # by name; that both sides of the boundary are pinned at every
        # timescale; that a loop with no period is not raised even the first
        # time; that a raise whose time cannot be read at all is treated as no
        # raise, which is the correction that stopped one corrupt record
        # silencing a wanting for ever; and that a raise **spends no day**,
        # which is what keeps CAP-10's interrupt from eating the morning budget
        # the day it lands.
        #
        # 72 selected, 64 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_nagging -q --collect-only \
            | grep -c '::' || true)
          echo "nagging-bound cases collected: $collected"
          if [ "$collected" -lt 64 ]; then
            echo "::error::the nagging gate collected $collected cases; the bound is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_nagging

      - name: 'CAP-8: the structural rules the morning surface rests on'
        # A third gate, small and separate, for the reason
        # ``cap12_aftercare_property`` and ``cap6_structure`` exist — and this
        # story needed it demonstrated rather than argued: review deleted the
        # six AST separation cases and the three structural ceiling cases and
        # both larger gates stayed green, because a floor on a superset cannot
        # protect a handful of single cases inside it.
        #
        # What it covers, and none of it is behavioural:
        #
        #   the surface is handed a **projection** and not the fold, so
        #   ``if state.aftercare is not None: return Silence(...)`` — which
        #   review wrote, and which passed 3182 tests while permanently
        #   silencing a main whose aftercare had finished — is an
        #   ``AttributeError`` rather than a line a scan has to be clever
        #   enough to see; that the allowlist is read from the module rather
        #   than copied into the test; that every call in the package to a
        #   function returning a ``License`` — the set **derived from the
        #   ladder itself** — passes a ceiling; that the module writing a raise
        #   cannot name a movement and the open-loop package cannot name a
        #   raise; that the fold's touch case cannot reach the loop table; and
        #   that no model and no network is reachable from the package at all.
        #
        # 13 selected, 12 required. A small gate on purpose: every case here is
        # the only one asserting its rule, so losing even two is losing a rule.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 structural cases collected: $collected"
          if [ "$collected" -lt 12 ]; then
            echo "::error::the CAP-8 structure gate collected $collected cases; a rule with one case has lost it"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_structure

      - name: 'CAP-8: the morning in words — prose on the wire, or nothing'
        # The wire-text gate. Until story 13a a main received
        # `content[b_1]: has not walked that plot since March` — the internal
        # serialization, label and belief id included — because the morning
        # surface sent `Context.render()`. That was a launch blocker, and the
        # thing about it that made it survive three stories is that nothing was
        # broken: the suite was green, the choice was right, the ladder held, and
        # the only wrong thing was the string.
        #
        # So this gate is over the subset that makes the string right, and it is
        # marker-selected rather than file-selected for the reason the AD-18,
        # CAP-6, CAP-7, CAP-8 and CAP-12 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # What it covers:
        #
        #   that the wire carries prose and no part of the context's own
        #   serialization — asserted by rendering the context the surface
        #   actually built and looking for its output, never against an expected
        #   string; that the judge accepts an ordinary morning in each of
        #   fourteen writing systems and a question asked without a question mark
        #   in each of the five languages that routinely ask that way; that two
        #   question marks are refused and one accepted for every question mark
        #   Unicode has, with the set re-derived from the Unicode property rather
        #   than compared to a list; that a language sample in any script reaches
        #   the generator and cannot reach the quotable channel; that a failed
        #   generation costs no day; that a provider absent, slow, failing, over
        #   its cap or raising all produce silence and never a template; that the
        #   breaker stands one main down without touching another; and that no
        #   generated string is written to the log, a projection or a log line.
        #
        # **The margin is zero, and that is what it means here.** Every case in
        # this gate is the only one asserting its rule — *including each script
        # and each question mark*, because a script pruned is a script nobody
        # checks and that is precisely how story 12 shipped a correction path
        # that deleted beliefs on ordinary Thai and Japanese sentences with the
        # suite green. There is no redundant parameter in here to prune, so there
        # is no room to leave for pruning one. Adding cases moves this number
        # with them; nothing else may.
        #
        # **A superset floor cannot protect this, and the reason is not the one
        # an earlier revision gave.** That revision said all of these could be
        # deleted with `cap8` green, which is false — deleting them leaves 185
        # against a floor of 475, so the superset gate is stronger than the
        # sentence
        # claimed. What `cap8` cannot do is protect any *subset*: its margin is
        # 10, so deleting the fourteen script cases, or the twenty question-mark
        # cases, or the three cluster-boundary cases, passes it comfortably. That
        # is what this gate is for, and it is why its own margin is zero.
        #
        # **Two of these cases exist because a mutation survived without them**,
        # which is the only honest way to size a gate. Replacing the holder
        # allowlist with a denylist of the four names a reader would reach for
        # survived the whole suite, so the refusal is now swept over nine method
        # names, seven of which no denylist would contain. And writing the
        # composed sentence into a log line on the *surface* survived every case
        # in the wire-text file, because the log scan lived only in the voice
        # package's own; there is now one over the whole morning path, in every
        # script.
        #
        # Review round 1 added forty-three, and every one of them exists because
        # a live mutation left the suite green: the breaker silencing the
        # tripwire, the tripwire losing to the judge, the tripwire switched off
        # by omission, a quotable claim that asks silencing a main for ever, a
        # short belief id doing the same, the window closing mid-composition, an
        # outage reported as a judge refusal, the alarm hidden at every hundredth
        # morning, an unequipped main counted into the operator's rate, the
        # sample depending on fold order, a hardcoded tier, the price of a real
        # morning on both tiers, and the flush at shutdown.
        #
        # **Story 13b's review loop added twenty-four**, all in
        # `tests/test_voice.py` and all about the one composer the turn now
        # shares: the gate's three bounds — one attempt per run, each bound
        # finite, a question only where a favour bought one — and the judge's
        # scaffolding set reading its labels from `half.voice.compose` rather
        # than respelling them. They belong to the morning gate because they are
        # the *composer's* rules and the composer is shared.
        #
        # The floor moves with them: **324 selected, 324 required.** It stood at
        # 300 while 324 were collected, which is a margin of twenty-four on a
        # gate whose own comment two paragraphs up says its margin is zero.
        #
        # **Story 14 adds three**, and this caller's position in that story is
        # the unusual one: the report cadence bug review round 1 fixed *here*
        # was still sitting in the other two modules, so what has to be shown
        # for the voice is that the extraction did not cost the caller that was
        # already right. The alarm case above is unchanged and passes against
        # the shared branch. The three added are: which numbers are the shape's
        # and which are the morning's, with the two ceilings that were always
        # identical now one answer; that the shape is read here rather than
        # kept alongside a local copy, run against the mutation it forbids; and
        # that the judge, the tripwire, the regeneration loop and this
        # package's whole closed vocabulary did **not** move — a shared module
        # holding any of the rubric would be one language's idea of good
        # writing handed to two callers that never asked for it.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap8_voice -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-8 wire-text cases collected: $collected"
          if [ "$collected" -lt 328 ]; then
            echo "::error::the wire-text gate collected $collected cases; Half may have stopped speaking, or started speaking scaffolding"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap8_voice

      - name: 'CAP-1: the turn in words — prose, the claim, or nothing'
        # The wire-text gate for the surface a main actually uses. Story 13a
        # took the internal serialization off the **morning**; until story 13b
        # the turn still emitted it — ``respond`` answered
        # ``noted. has not walked that plot since March``, a bought question
        # arrived as ``question[b_1] topic: farmland``, and a correction as
        # ``retract[b_land]: has not walked that plot since March``. All three
        # reached the main on the same wire.
        #
        # **A sibling of the ``cap8_voice`` gate rather than an extension of
        # it**, and that is deliberate. That gate protects the morning: its
        # margin is zero and every case in it is the only one asserting its
        # rule, so folding this gate's turn cases into it would take its floor
        # from 324 to 463 and leave a later reader unable to tell which half of
        # the number protected which surface. (An earlier revision did that
        # addition against stale counts on both sides and got 395, which is
        # neither the sum then nor the sum now — a gate that cannot add up the
        # protection it claims is the shape of defect the floors exist for.) A gate that reports itself
        # as covering more than it does is the defect this file has had to fix
        # three times. The morning and the turn share one composer and one
        # judge — that identity is itself asserted, here — and they are two
        # surfaces with two matrices.
        #
        # What it covers:
        #
        #   the fallback ladder, rung by rung — prose when the composer works,
        #   the claim alone when it does not, and silence only when there is
        #   nothing at all; that a context carrying **directives alone** is
        #   composed for rather than refused, which is review loop 1's amendment
        #   and the difference between a present Half and a month of silence for
        #   a main coming out of a crisis; that the claim rung is reachable with
        #   **no model call**,
        #   asserted structurally because deleting the guard changes nothing
        #   observable today and everything the first time a step is added to
        #   the gate; that a dead provider costs one bound and never three, and
        #   that a turn takes the turn's bound even inside a ``Voice`` built
        #   with the morning's;
        #   that a composed correction reply must contain the removed claim
        #   verbatim and is **not sent** when it does not, that the removed
        #   claim is the only thing such a reply may state, that the model is
        #   told the requirement through the ``word-for-word`` block in every
        #   one of fourteen scripts, and that a confirmed erasure shows the
        #   claim before the body is tombstoned;
        #   that the bought question arrives inside the message and never as a
        #   line, that a bought question with nothing to say is still asked, and
        #   that a **failed generation asks nothing and spends no favour** —
        #   with the positive control beside it, because the negative half alone
        #   passes on a build that never asks anybody anything;
        #   that a generated `behave` claim stops the send loudly and the claim
        #   goes instead, that a candidate echoing **any** of the prompt's block
        #   labels is refused by the judge — including the one story 13b adds,
        #   because a block added without adding it to the scaffolding set puts
        #   ``word-for-word:`` on somebody's wire and nothing says so — that no
        #   generated string reaches the log or a projection in any script, that
        #   a crisis turn reaches no model at all, and that a blank message and
        #   a redelivery reach none either.
        #
        # **Every "never called" is a counter asserted to be zero**, not a
        # double that raises: ``Voice._attempt_all`` catches ``Exception`` and
        # converts it to ``Unspoken(RAISED)``, a legal reason, so a raising
        # double passes whether or not the provider was paid. Story 13a's review
        # found that swallowing; this gate is written against it.
        #
        # **Five of these cases exist because a live mutation survived without
        # them**, which is the only honest way to size a gate: the favour spent
        # for a question the fallback never asked; the removed claim left
        # withheld from itself, which makes the composed correction path dead
        # for ever while the wire looks identical because the fallback *is* the
        # claim; the ordinary content channel left in beside the removed claim,
        # which lets Half answer *"that's wrong"* with an unrelated statement;
        # the fallback reading the last quotable claim rather than the top-ranked
        # one; and the model-free branch, which needed a structural case.
        #
        # **Margin zero: 139 selected, 139 required.** Every case is the only one
        # asserting its rule, including each of the fourteen scripts — a script
        # pruned is a script nobody checks, which is how story 12 shipped a
        # correction path that deleted beliefs on ordinary Thai and Japanese
        # sentences with the suite green. There is no redundant parameter in
        # here to prune, so there is no room left for pruning one. Adding cases
        # moves this number with them; nothing else may.
        #
        # It moved 95 -> 100 -> 139 across this story's review loop, and the
        # middle step lagged the cases: the gate collected 138 against a floor
        # of 100 while this comment said the margin was zero.
        # `tests/test_turn_words.py` carries `pytestmark = [cap1_turn]`, so every
        # case added to that file is a case added to this gate, and this number
        # has to be re-read off a collection rather than reasoned about.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap1_turn -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-1 turn wire-text cases collected: $collected"
          if [ "$collected" -lt 139 ]; then
            echo "::error::the turn wire-text gate collected $collected cases; a main may be receiving Half's internals again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap1_turn

      - name: 'CAP-4: the trust currency — computed from the log, stakes before the favour'
        # The currency CAP-4 rests on, and every rule in it decays in silence.
        # Nothing breaks the day the balance becomes a counter somebody
        # increments, the day the favour gate moves in front of the stakes gate,
        # the day one favour starts buying two questions, or the day a question
        # is spent for on a path that never asks it. Each of those is a Half
        # that is slightly more talkative, or slightly more cowardly, and
        # nothing else, for months.
        #
        # Marker-selected rather than file-selected, for the reason the AD-9,
        # CAP-6, CAP-7, CAP-8 and CAP-12 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **A floor on a superset protects nothing small**, which is why there
        # are five sub-gates below rather than a comfortable margin here. This
        # step's own margin is sized against the sub-gates: 337 selected, 327
        # required, so the margin is 10 — smaller than the smallest chunk any
        # sub-gate exclusively owns, and far smaller than any sub-gate entire.
        # Deleting a sub-gate's content drops this step beneath its floor *and*
        # fails that sub-gate.
        #
        # **The floor moves with the count so the margin does not grow.** Story
        # 11 added 155 cases — the bought question is the first thing in the
        # product that actually spends a favour — so the floor moves from 167 to
        # 337 - 10 = 327. Leaving it at 167 would have widened the margin to a
        # hundred and two, which is room for every case this story wrote. (The
        # count named in the previous revision of this comment, 177, was stale
        # against a measured 182; the numbers here are measured.)
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4 -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 cases collected: $collected"
          if [ "$collected" -lt 327 ]; then
            echo "::error::the CAP-4 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4

      - name: 'CAP-4: the favour buys the question — and buys exactly one'
        # A second gate over the half that carries the story, for the reason the
        # CAP-8 silence, CAP-7 resolution and CAP-6 firewall gates exist: a floor
        # on the superset cannot stop this half being hollowed out.
        #
        # What it covers: that the balance is the same after a rebuild, after
        # the derived view is deleted and replayed, and after a pass runs twice
        # — which is the case the tempting counter would still pass, because a
        # stored counter replays perfectly and is only ever *wrong*, never
        # *inconsistent*; that one delivered favour makes exactly one of two
        # good questions askable, that two favours make two, and that a question
        # which lost the budget comes back **held on the favour** rather than
        # vanishing between the two lists; that the budget is the *unspent*
        # balance and not what was ever earned; that a spend happens on the ask
        # and on no other path; that a spend which cannot be paid for is refused
        # rather than recorded; that a forged ``Ask`` is refused at both layers;
        # that two spends in one second do not share a record id; and that a
        # spend which landed is reported as landed even when the rebuild fails.
        #
        # **And the two orderings a single-threaded suite does not produce.** Two
        # turns handed to ``asyncio.gather`` do not interleave unless one awaits,
        # so a read-then-append implementation completes the first call whole and
        # the race never happens — which is exactly how a serialization bug
        # survives a suite that looks like it tests for one. One case therefore
        # forces the window open: a turn holds the mutex, a second reaches the
        # door, the first appends, and only then is the second let through. The
        # other is a main who enters crisis between the choice and the spend.
        # Both were verified against the mutation they exist for.
        #
        # Story 11 added thirteen: the favour actually being spent on the wire;
        # the ordering that makes *"no favour, no question"* true, since the day
        # this morning claims is itself a delivered favour and a surface that
        # offered after claiming would let today's message buy today's question;
        # two favours still buying one question in one send; the re-ask bound
        # costing a second favour a period later; and a send that fails after the
        # spend costing the main both — and, after a mutation escaped the suite,
        # three more for a spend the gates refuse at the last moment, which used
        # to put the question on the wire anyway. The floor moves with them,
        # 27 to 47.
        #
        # **The margin is deliberately zero: 48 selected, 48 required.** Review
        # found the previous margin was *exactly* the two concurrency cases the
        # gate exists for — delete them and the floor still passed, and
        # ``note_ask`` could then regress to read-under-one-acquire and
        # append-under-another with every gate green. Every case here is the
        # only one asserting its rule, so there is nothing to prune: changing
        # this set is a deliberate edit to this number.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4_favour -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 favour cases collected: $collected"
          if [ "$collected" -lt 48 ]; then
            echo "::error::the CAP-4 favour gate collected $collected cases; the currency is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4_favour

      - name: 'CAP-4: every gate on a question, alone and in combination'
        # A third gate, and it exists because review showed the alternative does
        # not work: the five AD-28 cases this story added and the three CAP-12
        # crisis cases were deletable with every other step green, because a
        # margin of six on AD-28 and sixty-one on CAP-12 cannot protect five and
        # three specific cases. They are gated here instead, where the margin is
        # zero.
        #
        # What it covers: each of the six refusals firing alone and reporting
        # its *own* reason, so a gate that stopped firing surfaces as another
        # gate's answer rather than as a pass; every pair of them together, both
        # ways round, still refusing with a reason inside the closed set; the
        # topic axis crossed with every other gate; a main capped at `behave`
        # asked nothing at every rung on the ladder, with no branch anywhere for
        # aftercare; a quarantined subject refused, at the queue and again at the
        # spend; a cap that drops between the choice and the spend; and the mode
        # that suspends all of it.
        #
        # It also carries the topic floor. That number was the one thing in this
        # story inherited rather than derived — ``> 0.0`` takes its effective
        # boundary from ``Strands``' housekeeping epsilon, so a topic mentioned
        # once stayed "already raised" for roughly eight further turns — and both
        # sides of the replacement are pinned.
        #
        # Story 11 added eight, and they are the same refusals asserted again
        # **on the wire** rather than against a hand-built view: a days-routine
        # never bought at any balance (swept across four), a main capped at
        # `behave`, a quarantined subject, a topic nobody raised, a main with no
        # conversation open at all, and a crisis opening between the choice and
        # the send — plus a quarantine landing between the offer and the spend,
        # and a main in the mode being asked nothing at all. The floor moves
        # with them, 46 to 57.
        #
        # 57 selected, 57 required. Zero margin, for the reason the favour gate
        # has none: a floor with room in it is a floor that lost the case it was
        # written for.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4_gates -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 gate cases collected: $collected"
          if [ "$collected" -lt 57 ]; then
            echo "::error::the CAP-4 gate sweep collected $collected cases; a gate has lost its case"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4_gates

      - name: 'CAP-4: stakes buy the clarifying question, and the bar is derived'
        # The first of the two gates, gated beside the currency rather than
        # inside it, because it is the rule that decays most quietly: a bar that
        # stopped barring would show up as a Half that asks slightly more
        # questions, and nothing else, for months.
        #
        # What it covers: that the bar is one interruption against each
        # wanting's *own* period, swept over all four timescales against one
        # question so that a single global threshold — which is what every
        # earlier version of a rule like this has been — fails by name; that the
        # interruption is read from ``PERIOD_DAYS`` rather than typed, asserted
        # *structurally* as well as by value, because review set it to the
        # literal ``1`` and the value check passed; that both sides of the
        # boundary are pinned, since story 8's review found a threshold anything
        # between six and thirteen satisfied; that a wanting with no period, no
        # state this build knows, or none at all is *below* the bar and never
        # above it; and that a low-stakes question is unaskable at every
        # balance, swept across the balance rather than asserted at one value —
        # a single-balance case would pass with the gates reversed.
        #
        # 30 selected, 28 required. The margin of two is the per-timescale
        # sweep's own redundancy, and it is safe to have here because the
        # guarantee underneath is pinned twice over: the derivation
        # structurally, and every scale's answer individually.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4_stakes -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 stakes cases collected: $collected"
          if [ "$collected" -lt 28 ]; then
            echo "::error::the CAP-4 stakes gate collected $collected cases; the bar is unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4_stakes

      - name: 'CAP-4: the questions channel is bought, and asked on the turn'
        # The gate for the half of CAP-4 that reaches the main. Story 5b built
        # the currency, the gates and the spend and **nothing called them**: an
        # `ask`-rung belief became a question line and the morning surface put
        # it on the wire with no favour spent. This step exists so that cannot
        # happen twice, and so the fix cannot decay into the nag the story names
        # as the failure to avoid.
        #
        # Marker-selected rather than file-selected, for the reason every other
        # gate here is: it must not go green because another step happened to
        # run one of the same files. The cases live in tests/test_questions.py,
        # tests/test_bought.py and tests/test_context.py.
        #
        # What it covers, and each of these is a rule with no second case:
        #
        #   that a question reaches a context **only by being handed in** — as an
        #   exhaustive truth table over every rung x every ceiling x every way of
        #   being bought or not, checked against an expectation written in the
        #   test rather than read from the code, so that no inverted guard, no
        #   ternary and no `match` can satisfy it. This replaced an AST scan that
        #   `if not bought: return Question(...)` walked straight past;
        #   that **exactly one expression in the whole tree** can construct a
        #   Question, with a bypass case for a second construction site;
        #   that a send carries **exactly one** question, read off the resolved
        #   type (`Optional[Question]`, not an annotation string) rather than
        #   counted off a fixture, swept over ranked sets of four sizes and
        #   asserting one is *present* — the earlier `<= 1` held at zero;
        #   that the re-ask bound is the **wanting's own period**, swept over all
        #   four timescales twice: once against the pure bound with both sides of
        #   every boundary pinned, and once end to end through the real registry,
        #   store and runtime, where one shared cooldown answers wrongly for
        #   three of the four and fails by name;
        #   that **one reply retires one question, and only inside its own
        #   window** — the interruption that question cost, imported from
        #   half.trust.stakes and asserted structurally as well as by value. The
        #   first build closed every open question on any later message for ever;
        #   that the favour **precedes the turn**: nothing a turn writes is a
        #   delivered favour, so a question can never be funded by the message
        #   carrying it, which is the defect that made the first build's rule
        #   vacuous;
        #   that **no line means no spend** — a bought belief the ladder raised
        #   above `ask`, or one whose topic echoes its claim, produces no question
        #   and writes no `asked` record;
        #   that the **morning surface cannot ask**, asserted as an import rule
        #   over the whole half/surface package with its own bypass case, and
        #   behaviourally with a full morning that spends nothing;
        #   that both fail-open handlers actually degrade — a broken engine and a
        #   spend that raises each cost the question and never the reply;
        #   and that no string constant outside a docstring is a phrase, on every
        #   module that builds what reaches the wire — half/questions, and now
        #   half/context/channels.py and half/context/build.py, which is where
        #   the words actually are.
        #
        # **Margin zero: 152 selected, 152 required.** Sized against the subset
        # it protects rather than against a total, and every case here is the
        # only one asserting its rule.
        #
        # **Forty-eight of them are one exhaustive parametrize**, and that is
        # fine *here* in a way it was not in the AD-18 and AD-28 gates: this gate
        # is about bought-ness, so a floor dominated by the truth table over
        # bought-ness reports what it protects. The same cases carried into those
        # two gates reported coverage that did not exist, and were removed from
        # them.
        #
        # **The number is file-coupled for tests/test_questions.py**, which
        # carries the marker at module scope because every case in it is a
        # story-11 rule; tests/test_bought.py and tests/test_context.py mark per
        # case. Adding a case to either is therefore a deliberate edit to this
        # number, which is what a zero margin means.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4_bought -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 bought-question cases collected: $collected"
          if [ "$collected" -lt 152 ]; then
            echo "::error::the CAP-4 bought gate collected $collected cases; the questions channel may be free again"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4_bought

      - name: 'CAP-4: the structural rules the currency rests on'
        # A fifth gate, for the reason ``cap8_structure``,
        # ``cap12_aftercare_property`` and ``cap6_structure`` exist — and story
        # 10's review had to demonstrate rather than argue it: a floor on a
        # superset cannot protect a handful of single cases inside it, and every
        # case here is the only one asserting its rule.
        #
        # What it covers, and none of it is behavioural:
        #
        #   that ``State`` has **no field** to keep a balance in, which is the
        #   half of AD-30 a behavioural case cannot give — a stored counter
        #   replays perfectly, so no round-trip assertion would ever see it;
        #   that the derived view holds no spend and no count; that
        #   ``half/trust/balance.py`` cannot name SQLite, a store or the derived
        #   view *in code* — the scan reads the AST rather than the prose,
        #   because this module's own docstring explains the failure it is
        #   written against; that the stakes rule cannot import or name a
        #   balance, which is the order of the two gates made structural; that
        #   the interruption is *subscripted out of* ``PERIOD_DAYS``; that the
        #   queue is handed a projection built **from** ``VISIBLE``, so the
        #   allowlist allows rather than documents; that the door reads a cap
        #   the derived view has not seen yet, which is the AD-28 window the
        #   fold exists to close; that the package reaches a main's log only
        #   through a three-method door whose signatures are bound to the real
        #   registry; that no import resolves under a store or the actor, and no
        #   write-shaped call is made, on any spelling; and that the closed sets
        #   a verdict is read against are importable beside the type.
        #
        # Four of these carry their own bypass case, each run against the
        # mutation it forbids: the AST name scan ignores prose and catches code;
        # the door predicate ignores ``list.append``; the import resolver
        # catches ``from half.store import store as _second``, which is the
        # second writer review actually wrote and which the previous four-string
        # denylist did not see; and the write scan catches ``opened.record(...)``
        # while ignoring a local list.
        #
        # 35 selected, 35 required. Zero margin: every case is a rule.
        #
        # Story 11's review round added five. The narrow-door rule and the
        # no-model rule are now **parametrized over both packages that reach a
        # main's log through an injected door** - half/trust and half/questions
        # - because story 11's first build copied this guard into its own file
        # as a string-prefix denylist and both of 5b's known bypasses walked
        # past the copy. A predicate worth having twice is worth having once.
        #
        # **Story 13a added two more, and the floor moves from 37 to 39.**
        # half/voice joined the same two parametrized sweeps rather than
        # carrying a fourth copy of them, with an **empty** door — it is handed a
        # split context, a language sample and a withheld set, and a store there
        # would be a second writer while a *read* of one would be a composer
        # choosing its own material. It lifts the model root and only that root,
        # because composing the morning's sentence through the port is its whole
        # subject (story 13a), and pays for the lift in tests/test_voice.py: the
        # port's narrow generator, refused at construction unless `generate` is
        # its only public method. The margin stays zero, which is the right size
        # for a gate where every case is the only one asserting its rule.
        #
        # **Story 12 added two, and the floor moved from 35 to 37 with it.**
        # half/correction joined the same two parametrized sweeps rather than
        # carrying a third copy of them, with an **empty** door - it has no
        # ledger at all, because its append happens where the main's mutex is
        # already held - and with the model root lifted from the outward rule
        # and only that root, because its recall instrument is a model by design
        # (CAP-11). Both cases assert the rule this gate has always protected,
        # for a third package, so the two are coverage of it rather than a
        # different story's cases parked under this name.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m cap4_structure -q --collect-only \
            | grep -c '::' || true)
          echo "CAP-4 structural cases collected: $collected"
          if [ "$collected" -lt 39 ]; then
            echo "::error::the CAP-4 structure gate collected $collected cases; a rule with one case has lost it"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m cap4_structure

      - name: 'AD-5 and AD-30: retrieval degrades, and never writes'
        # The reranker fallback, the salience-is-derived assertions, the
        # no-clock scan, and the AD-3 discard-and-replay of an older derived
        # view all live here and were named by no gate.
        run: uv run --locked --extra dev pytest -q tests/test_retrieval.py

      - name: 'AD-19: one model port, cache breakpoints first-class'
        # The model port is the first thing in Half that can spend money and
        # the first that can author text, and every rule in it decays quietly:
        # nothing breaks the day a `generate` appears on the classifier, a
        # model name is written into a call site, a breakpoint is clamped to
        # where it would fit, a failure collapses two of the four kinds into
        # one, or a budget starts being checked after the call instead of
        # before it. The suite stays green and the free tier's cost model is
        # silently different — or a main in crisis is answered by something
        # that authored the words.
        #
        # Marker-selected rather than file-selected, for the reason the AD-18,
        # AD-28, CAP-12, CAP-6 and AD-9 steps are: it must not go green because
        # another step happened to run one of the same files.
        #
        # **The floor carries margin that is not the cases it protects**, the
        # rule review has had to establish for four stories running. 330
        # selected, 290 required — and the margin is deliberately smaller than
        # the 120 non-guarantee cases, so the slack cannot be absorbed by
        # deleting guarantees, which is what review round 2 measured happening
        # on the gate below.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad19 -q --collect-only \
            | grep -c '::' || true)
          echo "AD-19 cases collected: $collected"
          if [ "$collected" -lt 290 ]; then
            echo "::error::the AD-19 gate collected $collected cases; it has stopped asserting"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad19

      - name: 'AD-19: the promises inside the port'
        # The subset that carries the story, gated separately for the reason
        # the CAP-12 durability, CAP-6 firewall and AD-9 guarantee gates exist:
        # a floor on the superset cannot stop this half being hollowed out, and
        # the half that would go with it is the half where the rules are
        # properties rather than spellings.
        #
        # These are the cases a mutation has actually been run against, each
        # failing by name. From the first round: a classify-only holder with
        # exactly one public method (and a synthetic subclass that adds a
        # `generate`); no model named outside the tier table; a breakpoint
        # placed where the caller put it and refused rather than clamped when
        # it will not fit; the four failures distinct and none carrying a
        # substituted answer; an over-budget call refused with nothing sent;
        # one ledger shared by every holder; a submission collected by a
        # different provider; no model reachable from a fold, transitively.
        #
        # From review round 1, each reproduced before it was fixed:
        #
        #   the pass ceiling binding at the scheduler's own DEFAULT_BOUND
        #   (eight admitted against a three-call ceiling before admission
        #   reserved); a non-Latin estimate at or above one token per
        #   character, per script (300 CJK characters priced identically to
        #   300 Latin); the AD-22 scan reading argument zero, with nine
        #   bypasses including the f-string that walked past all 122 cases of
        #   the first gate; the classify-only holder exposing no attribute at
        #   all, so the crisis path's object cannot reset the pass ledger; a
        #   one-hour cache write charged at the one-hour basis; every declared
        #   Reason produced by some path; Failure.spent truthful per reason; a
        #   batch state this build cannot read stopping the polling; a
        #   mid-stream failure keeping the rows already read; the pass total
        #   surviving a restart the way the submission does; every rendered
        #   wire shape checked against the SDK's own typed parameters rather
        #   than against the renderer; every stop reason the SDK declares
        #   handled; and the model table pinned to its absolute values.
        #
        # And from review round 2, each reproduced before it was fixed:
        #
        #   a reservation released on every path out — round 1's own
        #   cache-minimum refusal raised from the renderer, which sat after
        #   `admit` and outside any handler, so five retries of a mis-stated
        #   breakpoint drained the pass and every honest call after it was
        #   refused with nothing sent; a reservation exchangeable exactly once
        #   and only by its issuer (a double settle recorded 120 against a 100
        #   ceiling, a foreign one settled clean, a hand-made one freed the
        #   ledger through a `max(0, …)` clamp); the cache-minimum refusal
        #   itself, which `if False:` could disable with all 2,316 tests green;
        #   the nested message and system-block shapes, where two guaranteed
        #   400s both passed because the scan read only the top level; a
        #   relative import of the port into the fold, which passed both AD-30
        #   scans; and the model-name scan's call route.
        #
        # **The floor is no longer the only protection, and round 2 is why.**
        # Every case this gate selects is a guarantee case, so its margin could
        # only ever be absorbed by deleting guarantees — measured: dropping
        # eight of them left both gates green. So the flagship cases are now
        # named one by one inside the suite
        # (`test_every_guarantee_this_story_rests_on_still_exists`), the way
        # `tests/test_loops.py` names the guards its firewall rests on.
        # Deleting one fails by name; deleting the naming case drops this gate
        # 36 cases and fails by arithmetic.
        #
        # **Story 14 adds the shape three callers now share**
        # (`tests/test_consult.py`, 64 cases). It belongs on this gate because
        # `half/model/consult.py` is part of this package and every one of its
        # cases is a guarantee case: the report cadence whose branch was wrong
        # in three modules at once, the breaker, the holder allowlist swept
        # over names no denylist would contain, the two bound predicates, and
        # the scans proving the shape names no label, no meaning and no
        # morning. Deleting story 14's payoff drops this gate 64 cases and
        # fails by arithmetic; the margin below is unchanged at 15.
        #
        # 274 selected, 259 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m ad19_guarantee -q --collect-only \
            | grep -c '::' || true)
          echo "AD-19 guarantee cases collected: $collected"
          if [ "$collected" -lt 259 ]; then
            echo "::error::the AD-19 guarantee gate collected $collected cases; the promises are unguarded"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m ad19_guarantee

      - name: 'The suite reaches no network, asserted at the socket'
        # Its own step, because it is the only gate in the tree that is not a
        # statement about Half's code: it is a statement about every test, and
        # it is the one that would notice an SDK constructed for real wherever
        # somebody wrote it.
        #
        # It runs the whole suite in a subprocess with every spelling of
        # `connect` — and of name resolution, which is what an SDK reaches
        # first — replaced by something that raises. The guard goes in through
        # `sitecustomize`, so the subprocesses the suite spawns of its own are
        # covered too.
        #
        # The floor covers the non-vacuity cases as well as the run: a guard
        # nobody has tried to defeat is a guard resting on nothing, so five of
        # these are deliberate bypasses, one per way of reaching out, plus the
        # child-process case, the one that closes the recursion the first
        # version of this file opened, and — since review round 1 — the case
        # that proves the implementation module is free of the SDK entirely,
        # which is why the transport is a module of its own.
        # 14 selected, 11 required.
        run: |
          set -euo pipefail
          collected=$(uv run --locked --extra dev pytest -m offline -q --collect-only \
            | grep -c '::' || true)
          echo "offline cases collected: $collected"
          if [ "$collected" -lt 11 ]; then
            echo "::error::the offline gate collected $collected cases; the suite may now reach the network"
            exit 1
          fi
          uv run --locked --extra dev pytest -q -m offline
