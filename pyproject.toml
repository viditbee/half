[project]
name = "half"
version = "0.1.0"
description = "A second self that lives in your messaging app."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=22.8,<23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
half = "half.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["half"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Named so CI can gate on one invariant at a time and a red build says which
# one broke, rather than pointing at a whole file that covers several.
markers = [
    "ad18: no retrieved belief text may reach an outbound message",
    "ad24: retrieval weights and never excludes",
]
