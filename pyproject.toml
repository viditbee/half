[project]
name = "half"
version = "0.1.0"
description = "A second self that lives in your messaging app."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=22.8,<23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
half = "half.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["half"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers so a misspelled or renamed marker is an error rather than a
# gate that selects nothing and exits green; --strict-config so a typo in this
# table is the same. `pytest -m ad99` used to print "416 deselected" and exit
# 0, which meant renaming a marker turned the AD-18 step into a no-op.
addopts = "--strict-markers --strict-config"
# Named so CI can gate on one invariant at a time and a red build says which
# one broke, rather than pointing at a whole file that covers several.
markers = [
    "ad18: licenses are enforced at context construction, never by filtering",
    "ad24: retrieval weights and never excludes",
    "ad28: one license ceiling per actor, applied where licenses are resolved",
]
