[project]
name = "half"
version = "0.1.0"
description = "A second self that lives in your messaging app."
requires-python = ">=3.12"
# Official platform SDKs only (AD-6). The Anthropic SDK is a hard dependency
# rather than an extra even though ``half.model`` ships with no production
# caller (story 9b): the AD-2 gate reads this list to decide what the runtime
# may import, and an optional dependency there is an undeclared one. It is
# reached from exactly one class — ``SDKTransport``, imported lazily inside its
# own constructor — so importing Half still builds no client and reads no key.
dependencies = [
    "anthropic>=1.2,<2",
    "python-telegram-bot>=22.8,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
half = "half.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["half"]

# The crisis-line directory ships inside the package as well as sitting at the
# project root, so an installed Half has lines to offer out of the box.
# ``half.crisis.directory.default_path`` walks up from its own module looking
# for ``data/crisis-lines.json``, which finds the repository copy here and this
# copy there — one search, both shapes. An operator replaces either file and
# the next crisis turn uses it: data, refreshable without a release.
[tool.hatch.build.targets.wheel.force-include]
"data/crisis-lines.json" = "half/data/crisis-lines.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers so a misspelled or renamed marker is an error rather than a
# gate that selects nothing and exits green; --strict-config so a typo in this
# table is the same. `pytest -m ad99` used to print "416 deselected" and exit
# 0, which meant renaming a marker turned the AD-18 step into a no-op.
addopts = "--strict-markers --strict-config"
# Named so CI can gate on one invariant at a time and a red build says which
# one broke, rather than pointing at a whole file that covers several.
markers = [
    "ad18: licenses are enforced at context construction, never by filtering",
    "ad24: retrieval weights and never excludes",
    "ad28: one license ceiling per actor, applied where licenses are resolved",
    "cap4_bought: the questions channel is bought — a question reaches a context only by being handed in, one per send by construction, and never a second time inside its wanting's own period",
    "cap4: the trust currency and the unasked queue — a balance computed from the log, stakes before the favour, and a favour that buys one question",
    "cap4_favour: the favour rule's own guarantees — the balance is folded and never counted, one favour buys one question, and a spend happens on the ask and nowhere else",
    "cap4_gates: every gate on a question, alone and in combination — stakes, the ladder under the ceiling, quarantine, the topic, the favour, and the mode that suspends all of them",
    "cap4_stakes: stakes buy the clarifying question — the bar derived from each wanting's own period against one interruption, and both sides of it",
    "cap4_structure: the single-case structural rules the currency rests on — no field to store a balance in, a stakes rule that cannot see one, a narrow door and a projection",
    "cap6: the open-loop ledger — the closed vocabulary, a loop's own timescale, computed silence",
    "cap6_firewall: a wanting is not a fact — nothing on the correction path may demote or freeze a loop",
    "cap6_structure: the firewall as a property of the package — who may name, mutate, or compose a loop state",
    "cap12: the crisis mode — the switch, the moment, and the never-list",
    "cap12_durable: crisis state that must survive eviction, restart and a full disk",
    "cap12_handoff: the warm handoff — the confirmed list, the versioned directory, the draft",
    "cap12_aftercare: coming back — the thirty-day floor, the steps, the main's answer, the held plan",
    "cap12_aftercare_property: the single-case structural rules aftercare and the safety plan rest on",
    "cap12_classifier: the second opinion — the label set, the two costs, uncertain against unavailable, and what leaves the machine",
    "cap12_classifier_property: the structural rules the second opinion rests on — the import-time refusal, the narrow holder, the sealed surface, the log scan",
    "ad9: the due-time queue — per-main due times, jitter, the file lock, bounded isolated work, and a missed window that sends nothing",
    "ad9_guarantee: the promises inside the queue — no catch-up on any path, the lock, the bound, isolation, the durable write that stops a pass, and the window across every zone",
    "one_clock: exactly one module reads a clock, everything below it takes an injected now, and no signal is consulted to guess a zone",
    "one_clock_guarantee: the three sentences that half exists to make true — one reader, no zone inference, and a due time the host's own timezone cannot move",
    "ad19: the model port — classify apart from generate, cache breakpoints first-class, the four failures, the tier on the main, and a budget that refuses before it spends",
    "ad19_guarantee: the promises inside the port — a classifier that cannot author text, a breakpoint nothing moves, a model named in one table, a submission that outlives its process, no content in a log, and no model reachable from a fold",
    "cap7: the tension ledger — the closed vocabulary, widening computed from the log, and the pass that re-evaluates it",
    "cap7_resolution: a correction resolves a tension and never deletes one — the deliberate inverse of the loop firewall",
    "cap7_neutrality: neither side of a tension is wrong — nothing ranks the two entries or records one as mistaken",
    "cap7_minting: minting is bounded — new or changed against the loop set and the subject set, a cheap filter before any judgement, a fixed per-main budget, never all-pairs, and nothing minted twice",
    "cap7_judgement: the disagreement judgement — the gap and never the truth, a contradiction that answers no, three values that cannot collapse, a bound that fits the pass, two claims in any script and nothing durable",
    "cap8: the morning surface — at most one unprompted message a day, traceable to the preceding pass, and silence when there is nothing worth saying",
    "cap8_silence: silence is the ordinary outcome and not a degraded one — every gate, in every order, and the ceiling that makes aftercare silent with no aftercare branch",
    "cap8_nagging: a loop is never touched faster than its own timescale — the bound derived per loop, the record it reads, and its separation from both movement and a spent day",
    "cap8_structure: the single-case structural rules the surface rests on — the narrowed view, the ceiling that cannot be bypassed, and the walls between a raise, a movement and a day",
    "cap10: the interruption — five refusals in a fixed order, the judgement last and never reached for a main who could not be sent to, the interruption's own bound, and a build that never interrupts",
    "cap10_restraint: the single-case structural rules restraint rests on — one method on the port, no horizon on what a judge sees, no implementation anywhere in the tree, no writer and no plural door out, and a composition root that wires none",
    "cap8_voice: the morning in words — the two channels handed over separately, the language sample that can never become content, the cheap judge in every script, the bounded regenerations, and silence rather than a template",
    "cap1_turn: the turn in words — prose on the wire, the claim alone where generation fails, silence only where there is no claim, the question composed in, and the removed claim shown verbatim",
    "cap11: correction — an explicit correction recognised offline and acted on, a candidate that never acts alone, three attributions and never a guess, and the removed claim shown as recorded",
    "cap11_structure: the single-case structural rules correction rests on — no store in the package, no op read for an attribution, no inference route to an append, and nothing composed",
    "cap3: the revealed ledger — a claim derived at ingest from a scrubbed body, admitted only when the union-find finds two independent groups behind it, citing the messages it came from",
    "cap3_structure: the single-case structural rules the revealed ledger rests on — scrub before derive on every path including a raise, a threshold nothing can lower, a count that is the union-find's answer and never the support size, a closed claim vocabulary, and a body that persists nowhere",
    "cap5_admission: a message is evidence and a claim is a belief — the four admission gates, each naming itself and reporting every refusal, the mark that keeps a message out of every belief path, and the three readers that still read it",
    "cap5_structure: the single-case structural rules the separation rests on — the closed derivation vocabulary, the doors that hand out claims, the narrow holder that cannot author a claim, and a derivation that never costs a reply",
    "offline: the suite reaches no network, asserted at the socket rather than by convention",
]
