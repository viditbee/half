[project]
name = "half"
version = "0.1.0"
description = "A second self that lives in your messaging app."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["half"]

[tool.pytest.ini_options]
testpaths = ["tests"]
